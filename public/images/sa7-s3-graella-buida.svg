<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="430" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">La graella del comitè (en blanc)</text>
<text x="380" y="44" text-anchor="middle" font-size="12.5" fill="#5a5580">Cada targeta del dossier té un sol destí. Una no encaixa en cap de les quatre propostes</text>

<!-- capçalera -->
<rect x="20" y="58" width="200" height="34" fill="#241F4A"/>
<rect x="220" y="58" width="260" height="34" fill="#241F4A"/>
<rect x="480" y="58" width="260" height="34" fill="#241F4A"/>
<text x="120" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PROPOSTA</text>
<text x="350" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PROVA A FAVOR</text>
<text x="610" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">EL QUE ENCARA NO EXPLICA</text>

<!-- files -->
<g stroke="#bdb7d6" stroke-width="1.4" fill="none">
<rect x="20" y="92" width="200" height="62"/><rect x="220" y="92" width="260" height="62"/><rect x="480" y="92" width="260" height="62"/>
<rect x="20" y="154" width="200" height="62"/><rect x="220" y="154" width="260" height="62"/><rect x="480" y="154" width="260" height="62"/>
<rect x="20" y="216" width="200" height="62"/><rect x="220" y="216" width="260" height="62"/><rect x="480" y="216" width="260" height="62"/>
<rect x="20" y="278" width="200" height="62"/><rect x="220" y="278" width="260" height="62"/><rect x="480" y="278" width="260" height="62"/>
</g>
<rect x="20" y="92" width="200" height="62" fill="#f1effa" stroke="#bdb7d6" stroke-width="1.4"/>
<rect x="20" y="154" width="200" height="62" fill="#ffffff" stroke="#bdb7d6" stroke-width="1.4"/>
<rect x="20" y="216" width="200" height="62" fill="#f1effa" stroke="#bdb7d6" stroke-width="1.4"/>
<rect x="20" y="278" width="200" height="62" fill="#ffffff" stroke="#bdb7d6" stroke-width="1.4"/>

<text x="34" y="120" font-size="13" font-weight="700" fill="#241F4A">1 · Sopa primordial</text>
<text x="34" y="138" font-size="11.5" fill="#5a5580">basses, gasos i llamps</text>
<text x="34" y="182" font-size="13" font-weight="700" fill="#241F4A">2 · Món ARN</text>
<text x="34" y="200" font-size="11.5" fill="#5a5580">una molècula que es copia</text>
<text x="34" y="244" font-size="13" font-weight="700" fill="#241F4A">3 · Fumaroles</text>
<text x="34" y="262" font-size="11.5" fill="#5a5580">xemeneies del fons del mar</text>
<text x="34" y="306" font-size="13" font-weight="700" fill="#241F4A">4 · Panspèrmia</text>
<text x="34" y="324" font-size="11.5" fill="#5a5580">va arribar de l'espai</text>

<!-- caselles buides indicades -->
<g font-size="11" fill="#c3bedb" text-anchor="middle">
<text x="350" y="128">enganxa aquí la targeta</text>
<text x="610" y="128">enganxa aquí la targeta</text>
<text x="350" y="190">enganxa aquí la targeta</text>
<text x="610" y="190">enganxa aquí la targeta</text>
<text x="350" y="252">enganxa aquí la targeta</text>
<text x="610" y="252">enganxa aquí la targeta</text>
<text x="350" y="314">enganxa aquí la targeta</text>
<text x="610" y="314">enganxa aquí la targeta</text>
</g>

<!-- casella fora de la ciència -->
<rect x="20" y="356" width="720" height="58" rx="8" fill="#fdf7e2" stroke="#c8960a" stroke-width="1.8"/>
<text x="34" y="378" font-size="13" font-weight="700" fill="#7a5800">5 · Aquesta targeta no encaixa en cap de les quatre propostes</text>
<text x="34" y="398" font-size="11.5" fill="#7a5800">Enganxa-la aquí i, a la fitxa, explica per quina raó queda fora sense dir que sigui falsa.</text>
</svg>
