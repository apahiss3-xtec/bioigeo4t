<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="356" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">Simulació de la desintegració: el protocol (aquí no hi ha cap resultat)</text>
<rect x="24" y="46" width="168" height="132" rx="9" fill="#f1effa" stroke="#37306B" stroke-width="1.6"/>
<circle cx="46" cy="68" r="13" fill="#37306B"/><text x="46" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="66" y="73" font-size="13" font-weight="700" fill="#241F4A">Prepara</text>
<text x="38" y="98" font-size="11.5" fill="#33404b">Poseu tots els daus dins</text>
<text x="38" y="115" font-size="11.5" fill="#33404b">el got. Cada dau és un</text>
<text x="38" y="132" font-size="11.5" fill="#33404b">àtom de l'element de</text>
<text x="38" y="149" font-size="11.5" fill="#33404b">partida. Compteu-los i</text>
<text x="38" y="166" font-size="11.5" fill="#33404b">anoteu-ho a la tirada 0.</text>
<polygon points="204,112 194,107 194,117" fill="#37306B"/>
<rect x="204" y="46" width="168" height="132" rx="9" fill="#f1effa" stroke="#37306B" stroke-width="1.6"/>
<circle cx="226" cy="68" r="13" fill="#37306B"/><text x="226" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="246" y="73" font-size="13" font-weight="700" fill="#241F4A">Tira</text>
<text x="218" y="98" font-size="11.5" fill="#33404b">Aboqueu tots els daus</text>
<text x="218" y="115" font-size="11.5" fill="#33404b">dins d'una safata o una</text>
<text x="218" y="132" font-size="11.5" fill="#33404b">capsa, d'una sola vegada.</text>
<text x="218" y="149" font-size="11.5" fill="#33404b">Això és UNA tirada, i</text>
<text x="218" y="166" font-size="11.5" fill="#33404b">representa un interval.</text>
<polygon points="384,112 374,107 374,117" fill="#37306B"/>
<rect x="384" y="46" width="168" height="132" rx="9" fill="#f1effa" stroke="#37306B" stroke-width="1.6"/>
<circle cx="406" cy="68" r="13" fill="#37306B"/><text x="406" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="426" y="73" font-size="13" font-weight="700" fill="#241F4A">Retira</text>
<text x="398" y="98" font-size="11.5" fill="#33404b">Tots els daus que mostrin</text>
<text x="398" y="115" font-size="11.5" fill="#33404b">un 6 s'han desintegrat:</text>
<text x="398" y="132" font-size="11.5" fill="#33404b">aparteu-los. Ja no tornen</text>
<text x="398" y="149" font-size="11.5" fill="#33404b">mai més al got.</text>
<polygon points="564,112 554,107 554,117" fill="#37306B"/>
<rect x="564" y="46" width="168" height="132" rx="9" fill="#f1effa" stroke="#37306B" stroke-width="1.6"/>
<circle cx="586" cy="68" r="13" fill="#37306B"/><text x="586" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="606" y="73" font-size="13" font-weight="700" fill="#241F4A">Compta i repeteix</text>
<text x="578" y="98" font-size="11.5" fill="#33404b">Compteu els que queden</text>
<text x="578" y="115" font-size="11.5" fill="#33404b">al got i anoteu-ho.</text>
<text x="578" y="132" font-size="11.5" fill="#33404b">Torneu al pas 2 fins a</text>
<text x="578" y="149" font-size="11.5" fill="#33404b">completar 6 tirades.</text>
<path d="M 650 178 L 650 194 L 288 194 L 288 180" fill="none" stroke="#37306B" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="288,178 283,186 293,186" fill="#37306B"/>
<rect x="24" y="212" width="396" height="126" rx="9" fill="#ffffff" stroke="#b3aed0" stroke-width="1.4"/>
<text x="38" y="234" font-size="13" font-weight="700" fill="#241F4A">Què representa cada cosa</text>
<line x1="38" y1="241" x2="406" y2="241" stroke="#e0dcee" stroke-width="1"/>
<text x="38" y="262" font-size="12" fill="#33404b">un dau al got</text>
<text x="150" y="262" font-size="12" fill="#241F4A">&#8594;  un àtom que encara no s'ha desintegrat</text>
<text x="38" y="282" font-size="12" fill="#33404b">un dau apartat</text>
<text x="150" y="282" font-size="12" fill="#241F4A">&#8594;  un àtom que ja s'ha transformat</text>
<text x="38" y="302" font-size="12" fill="#33404b">una tirada</text>
<text x="150" y="302" font-size="12" fill="#241F4A">&#8594;  un interval de temps sempre igual</text>
<text x="38" y="322" font-size="12" fill="#33404b">treure un 6</text>
<text x="150" y="322" font-size="12" fill="#241F4A">&#8594;  la probabilitat de desintegrar-se</text>
<rect x="432" y="212" width="304" height="126" rx="9" fill="#eaf0f9" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="446" y="234" font-size="13" font-weight="700" fill="#2b4a75">Perquè la comparació sigui justa</text>
<line x1="446" y1="241" x2="722" y2="241" stroke="#c3d3e8" stroke-width="1"/>
<text x="446" y="259" font-size="11.5" fill="#2b4a75">· Tots els equips comencen amb el</text>
<text x="446" y="274" font-size="11.5" fill="#2b4a75">  mateix nombre de daus.</text>
<text x="446" y="289" font-size="11.5" fill="#2b4a75">· Sempre és el 6 el que desintegra.</text>
<text x="446" y="304" font-size="11.5" fill="#2b4a75">· Un dau apartat no torna: la</text>
<text x="446" y="319" font-size="11.5" fill="#2b4a75">  transformació no és reversible.</text>
<text x="446" y="334" font-size="11.5" fill="#2b4a75">· Al final se sumen les dades de tots</text>
<text x="446" y="349" font-size="11.5" fill="#2b4a75">  els equips: són les rèpliques.</text>
</svg>