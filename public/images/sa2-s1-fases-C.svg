<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Fira Sans Condensed','Fira Sans',sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="27" font-weight="700" fill="#5A2E77">Les 4 fases, en ordre</text>
  <text x="360" y="58" text-anchor="middle" font-size="17" fill="#6b6274">Els fils foscos es preparen, s'alineen, se separen i es reparteixen.</text>

  <g>
    <rect x="16" y="76" width="160" height="200" rx="12" fill="#ffffff" stroke="#7B3F9E" stroke-width="2.5"/>
    <circle cx="96" cy="136" r="38" fill="#f3e8fa"/>
    <g stroke="#5A2E77" stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="120" x2="90" y2="150"/><line x1="98" y1="118" x2="106" y2="150"/>
      <line x1="112" y1="124" x2="116" y2="152"/>
    </g>
    <text x="96" y="204" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2E77">1 · PROFASE</text>
    <text x="96" y="232" text-anchor="middle" font-size="17" fill="#1d1622">Apareixen els</text>
    <text x="96" y="252" text-anchor="middle" font-size="17" fill="#1d1622">fils foscos.</text>
  </g>

  <g>
    <rect x="196" y="76" width="160" height="200" rx="12" fill="#ffffff" stroke="#7B3F9E" stroke-width="2.5"/>
    <circle cx="276" cy="136" r="38" fill="#f3e8fa"/>
    <line x1="276" y1="100" x2="276" y2="172" stroke="#cbaede" stroke-width="2" stroke-dasharray="4 4"/>
    <g stroke="#5A2E77" stroke-width="5" stroke-linecap="round">
      <line x1="270" y1="112" x2="270" y2="160"/><line x1="282" y1="112" x2="282" y2="160"/>
    </g>
    <text x="276" y="204" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2E77">2 · METAFASE</text>
    <text x="276" y="232" text-anchor="middle" font-size="17" fill="#1d1622">S'alineen tots</text>
    <text x="276" y="252" text-anchor="middle" font-size="17" fill="#1d1622">al mig.</text>
  </g>

  <g>
    <rect x="376" y="76" width="160" height="200" rx="12" fill="#ffffff" stroke="#7B3F9E" stroke-width="2.5"/>
    <circle cx="456" cy="136" r="38" fill="#f3e8fa"/>
    <g stroke="#5A2E77" stroke-width="5" stroke-linecap="round">
      <line x1="430" y1="118" x2="430" y2="154"/><line x1="442" y1="118" x2="442" y2="154"/>
      <line x1="470" y1="118" x2="470" y2="154"/><line x1="482" y1="118" x2="482" y2="154"/>
    </g>
    <text x="456" y="204" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2E77">3 · ANAFASE</text>
    <text x="456" y="232" text-anchor="middle" font-size="17" fill="#1d1622">Se separen cap</text>
    <text x="456" y="252" text-anchor="middle" font-size="17" fill="#1d1622">als dos costats.</text>
  </g>

  <g>
    <rect x="556" y="76" width="160" height="200" rx="12" fill="#ffffff" stroke="#7B3F9E" stroke-width="2.5"/>
    <circle cx="612" cy="136" r="26" fill="#f3e8fa"/>
    <circle cx="664" cy="136" r="26" fill="#f3e8fa"/>
    <circle cx="612" cy="136" r="14" fill="#cbaede" opacity="0.6"/>
    <circle cx="664" cy="136" r="14" fill="#cbaede" opacity="0.6"/>
    <text x="636" y="204" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2E77">4 · TELOFASE</text>
    <text x="636" y="232" text-anchor="middle" font-size="17" fill="#1d1622">Ja hi ha dues</text>
    <text x="636" y="252" text-anchor="middle" font-size="17" fill="#1d1622">cèl·lules.</text>
  </g>

  <text x="360" y="308" text-anchor="middle" font-size="18" fill="#6b6274">Abans de tot això hi ha la <tspan font-weight="700" fill="#5A2E77">interfase</tspan>: la cèl·lula descansa i copia el seu ADN.</text>
</svg>
