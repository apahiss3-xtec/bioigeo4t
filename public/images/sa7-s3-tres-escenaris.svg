<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="320" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">Els tres escenaris, dibuixats</text>
<text x="380" y="44" text-anchor="middle" font-size="12.5" fill="#5a5580">Aquí només hi ha l'escena de cadascun. Quin problema resol i què no explica, ho escrius tu</text>

<!-- ESCENARI 1 -->
<rect x="16" y="58" width="236" height="240" rx="10" fill="#fdfefe" stroke="#37306B" stroke-width="1.8"/>
<rect x="16" y="58" width="236" height="30" rx="10" fill="#37306B"/>
<rect x="16" y="78" width="236" height="10" fill="#37306B"/>
<text x="134" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 · La sopa primordial</text>
<!-- cel i llamps -->
<rect x="28" y="98" width="212" height="88" fill="#e7e2f2"/>
<path d="M 70 104 l -12 30 h 14 l -10 28" fill="none" stroke="#E3B04B" stroke-width="3"/>
<path d="M 178 108 l -12 28 h 14 l -10 26" fill="none" stroke="#E3B04B" stroke-width="3"/>
<ellipse cx="120" cy="112" rx="34" ry="12" fill="#cfc9e4"/>
<ellipse cx="196" cy="118" rx="28" ry="10" fill="#cfc9e4"/>
<!-- bassa -->
<rect x="28" y="186" width="212" height="52" fill="#cfe0f2"/>
<path d="M 28 186 q 26 -8 53 0 q 26 8 53 0 q 26 -8 53 0 q 26 8 53 0 v 6 h -212 z" fill="#b9d2ea"/>
<circle cx="70" cy="206" r="4.5" fill="#37306B"/><circle cx="104" cy="216" r="4.5" fill="#37306B"/>
<circle cx="146" cy="204" r="4.5" fill="#37306B"/><circle cx="182" cy="220" r="4.5" fill="#37306B"/>
<circle cx="122" cy="228" r="4.5" fill="#37306B"/><circle cx="206" cy="200" r="4.5" fill="#37306B"/>
<rect x="28" y="238" width="212" height="16" fill="#a68f6a"/>
<text x="134" y="270" text-anchor="middle" font-size="12" fill="#33404b">Basses poc profundes amb llamps, i</text>
<text x="134" y="286" text-anchor="middle" font-size="12" fill="#33404b">molècules que s'hi van acumulant</text>

<!-- ESCENARI 2 -->
<rect x="262" y="58" width="236" height="240" rx="10" fill="#fdfefe" stroke="#37306B" stroke-width="1.8"/>
<rect x="262" y="58" width="236" height="30" rx="10" fill="#37306B"/>
<rect x="262" y="78" width="236" height="10" fill="#37306B"/>
<text x="380" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 · El món ARN</text>
<!-- cadena que es copia -->
<path d="M 300 110 q 20 18 40 0 q 20 -18 40 0 q 20 18 40 0 q 20 -18 40 0" fill="none" stroke="#B0821F" stroke-width="4"/>
<circle cx="300" cy="110" r="5" fill="#E3B04B"/><circle cx="340" cy="110" r="5" fill="#E3B04B"/>
<circle cx="380" cy="110" r="5" fill="#E3B04B"/><circle cx="420" cy="110" r="5" fill="#E3B04B"/>
<circle cx="460" cy="110" r="5" fill="#E3B04B"/>
<text x="380" y="98" text-anchor="middle" font-size="11.5" fill="#7a5800">una cadena d'ARN</text>
<!-- fletxa doble funció -->
<path d="M 330 128 L 316 160" fill="none" stroke="#4a6fa5" stroke-width="2"/>
<polygon points="316,160 322,150 328,157" fill="#4a6fa5"/>
<path d="M 430 128 L 446 160" fill="none" stroke="#4a6fa5" stroke-width="2"/>
<polygon points="446,160 434,157 440,150" fill="#4a6fa5"/>
<rect x="272" y="164" width="100" height="52" rx="8" fill="#eaf0f9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="322" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b4a75">fa de recepta</text>
<rect x="390" y="164" width="100" height="52" rx="8" fill="#eaf0f9" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="440" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b4a75">fa de cuiner</text>
<!-- copia -->
<path d="M 340 230 q 20 16 40 0 q 20 -16 40 0" fill="none" stroke="#B0821F" stroke-width="3" stroke-dasharray="5 4"/>
<text x="380" y="256" text-anchor="middle" font-size="12" fill="#33404b">i podria fer-ne còpies d'ella mateixa:</text>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="#33404b">és el que es proposa, encara</text>
<text x="380" y="288" text-anchor="middle" font-size="12" fill="#33404b">no s'ha vist passar sol</text>

<!-- ESCENARI 3 -->
<rect x="508" y="58" width="236" height="240" rx="10" fill="#fdfefe" stroke="#37306B" stroke-width="1.8"/>
<rect x="508" y="58" width="236" height="30" rx="10" fill="#37306B"/>
<rect x="508" y="78" width="236" height="10" fill="#37306B"/>
<text x="626" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 · Les fumaroles</text>
<!-- mar fosc -->
<rect x="520" y="98" width="212" height="140" fill="#20385c"/>
<text x="626" y="114" text-anchor="middle" font-size="11.5" fill="#b9cbe4">fons del mar · sense llum</text>
<!-- xemeneia -->
<path d="M 596 238 L 606 150 L 646 150 L 656 238 z" fill="#6b6357" stroke="#3c372f" stroke-width="1.4"/>
<rect x="520" y="230" width="212" height="24" fill="#4a4238"/>
<!-- porus -->
<circle cx="614" cy="176" r="7" fill="#cfe0f2" stroke="#eaf0f9" stroke-width="1"/>
<circle cx="634" cy="190" r="7" fill="#cfe0f2" stroke="#eaf0f9" stroke-width="1"/>
<circle cx="616" cy="208" r="7" fill="#cfe0f2" stroke="#eaf0f9" stroke-width="1"/>
<circle cx="638" cy="220" r="7" fill="#cfe0f2" stroke="#eaf0f9" stroke-width="1"/>
<text x="700" y="196" text-anchor="middle" font-size="11" fill="#dfe8f5">porus</text>
<line x1="676" y1="192" x2="648" y2="192" stroke="#dfe8f5" stroke-width="1.2"/>
<!-- aigua calenta -->
<path d="M 620 148 q -6 -18 4 -28 M 636 148 q 6 -18 -4 -30" fill="none" stroke="#E3B04B" stroke-width="2.4"/>
<text x="524" y="150" font-size="11" fill="#E3B04B">aigua calenta</text>
<text x="524" y="164" font-size="11" fill="#E3B04B">i alcalina</text>
<line x1="586" y1="146" x2="612" y2="132" stroke="#E3B04B" stroke-width="1.2"/>
<text x="626" y="270" text-anchor="middle" font-size="12" fill="#33404b">L'aigua calenta que surt es troba</text>
<text x="626" y="286" text-anchor="middle" font-size="12" fill="#33404b">amb l'aigua freda i àcida del mar</text>
</svg>
