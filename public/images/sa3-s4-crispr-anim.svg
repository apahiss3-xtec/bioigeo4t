0" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#22357A">2 · Tallar: la Cas9 talla les dues cadenes en aquell punt exacte</text><text class="t2" x="450.0" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#22357A">3 · Reparar: la cèl·lula tanca el tall i, amb un motlle, hi posa la lletra que volem</text><text class="t3" x="450.0" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#22357A">4 · ADN editat: G T G → G A G (exemple de laboratori: la lletra de la falciforme)</text><text x="450.0" y="380" text-anchor="middle" font-size="13.5" fill="#555">Model simplificat. CRISPR no inventa res: dirigeix el mateix tipus de canvi de lletres que fa una mutació.</text></svg>