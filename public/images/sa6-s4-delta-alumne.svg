  <text x="390" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#2A3D4C">De l'embassament al delta</text>
  <text x="390" y="43" text-anchor="middle" font-size="13" fill="#5c7285">Tall esquemàtic (no és a escala). La cadena de causes l'has d'escriure tu.</text>

