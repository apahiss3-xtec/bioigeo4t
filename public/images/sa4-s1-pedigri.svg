<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Fira Sans Extra Condensed','Segoe UI',sans-serif">
  <defs>
    <style>
      .ink{fill:#16302c}.mut{fill:#4d6560}.teal{fill:#1E7A70}
      .lbl{font-size:15px;fill:#16302c}.sm{font-size:13.5px;fill:#4d6560}
      .gt{font-size:14px;font-weight:700;fill:#17605A}
      .roman{font-size:14px;font-weight:700;fill:#8aa39e}
      .sym{stroke:#17605A;stroke-width:2.4;fill:#ffffff}
      .symf{stroke:#17605A;stroke-width:2.4;fill:#1E7A70}
      .link{stroke:#5c7a75;stroke-width:2.2;fill:none}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="46" fill="#1E7A70"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#ffffff">El pedigrí: símbols i un caràcter que salta una generació</text>

  <!-- ===== LLEGENDA ===== -->
  <rect x="16" y="62" width="266" height="300" rx="12" fill="#EAF5F2" stroke="#bfe0d9" stroke-width="1.5"/>
  <text x="32" y="88" font-size="14" font-weight="800" fill="#17605A" letter-spacing="1">LLEGENDA DELS SÍMBOLS</text>

  <rect class="sym" x="36" y="104" width="30" height="30" rx="3"/>
  <text class="lbl" x="82" y="124">Home</text>
  <circle class="sym" cx="197" cy="119" r="16"/>
  <text class="lbl" x="222" y="124">Dona</text>

  <rect class="symf" x="36" y="150" width="30" height="30" rx="3"/>
  <text class="lbl" x="82" y="170">Té el caràcter</text>

  <rect class="sym" x="36" y="196" width="30" height="30" rx="3"/>
  <text class="lbl" x="82" y="216">No el té</text>

  <line class="link" x1="40" y1="252" x2="86" y2="252"/>
  <text class="sm" x="98" y="256">Línia de parella</text>

  <line class="link" x1="63" y1="270" x2="63" y2="304"/>
  <text class="sm" x="98" y="292">Línia cap als fills</text>

  <text class="sm" x="32" y="332"><tspan font-weight="700" fill="#17605A">Genotip:</tspan> AA i Aa es veuen igual;</text>
  <text class="sm" x="32" y="350">només aa mostra el recessiu.</text>

  <!-- ===== PEDIGRÍ ===== -->
  <!-- Generacions -->
  <text class="roman" x="312" y="120">I</text>
  <text class="roman" x="312" y="220">II</text>
  <text class="roman" x="312" y="312">III</text>

  <!-- GEN I: avi afectat (aa) x àvia portadora (Aa) -->
  <rect class="symf" x="360" y="98" width="34" height="34" rx="3"/>
  <text class="gt" x="377" y="152" text-anchor="middle">aa</text>
  <circle class="sym" cx="475" cy="115" r="18"/>
  <text class="gt" x="475" y="152" text-anchor="middle">Aa</text>
  <line class="link" x1="394" y1="115" x2="457" y2="115"/>
  <!-- baixada a gen II -->
  <line class="link" x1="434" y1="115" x2="434" y2="166"/>
  <line class="link" x1="434" y1="166" x2="520" y2="166"/>
  <line class="link" x1="520" y1="166" x2="520" y2="198"/>

  <!-- GEN II: fill portador (Aa) x parella de fora portadora (Aa) -->
  <rect class="sym" x="503" y="198" width="34" height="34" rx="3"/>
  <text class="gt" x="520" y="252" text-anchor="middle">Aa</text>
  <circle class="sym" cx="618" cy="215" r="18"/>
  <text class="gt" x="618" y="252" text-anchor="middle">Aa</text>
  <line class="link" x1="537" y1="215" x2="600" y2="215"/>
  <!-- baixada a gen III -->
  <line class="link" x1="577" y1="215" x2="577" y2="264"/>
  <line class="link" x1="500" y1="264" x2="654" y2="264"/>
  <line class="link" x1="500" y1="264" x2="500" y2="290"/>
  <line class="link" x1="654" y1="264" x2="654" y2="289"/>

  <!-- GEN III: dos néts, un afectat (aa) i un sa -->
  <rect class="symf" x="483" y="290" width="34" height="34" rx="3"/>
  <text class="gt" x="500" y="344" text-anchor="middle">aa</text>
  <circle class="sym" cx="654" cy="307" r="18"/>
  <text class="gt" x="654" y="344" text-anchor="middle">AA o Aa</text>

  <!-- nota del salt -->
  <text class="mut" x="340" y="248" font-size="13.5" font-style="italic">Els pares (gen. II) no</text>
  <text class="mut" x="340" y="266" font-size="13.5" font-style="italic">mostren el caràcter</text>
  <text class="mut" x="340" y="284" font-size="13.5" font-style="italic">i el tornen a passar</text>
  <text class="mut" x="340" y="302" font-size="13.5" font-style="italic">al nét afectat.</text>
</svg>
