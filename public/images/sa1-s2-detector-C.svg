<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Fira Sans Extra Condensed','Fira Sans',sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#a24e24">El detector · els 3 senyals d'alerta</text>
  <text x="360" y="60" text-anchor="middle" font-size="17" fill="#4a6b72">Amb un sol senyal ja pots sospitar. Com més senyals, més clar.</text>

  <g>
    <rect x="22" y="82" width="216" height="176" rx="14" fill="#ffffff" stroke="#c96f3e" stroke-width="3"/>
    <circle cx="52" cy="112" r="17" fill="#c96f3e"/>
    <text x="52" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="158" text-anchor="middle" font-size="40">🚫</text>
    <text x="130" y="196" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">NO ES POT</text>
    <text x="130" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">COMPROVAR</text>
    <text x="130" y="246" text-anchor="middle" font-size="16" fill="#6b7a7e" font-style="italic">No hi ha cap experiment.</text>
  </g>

  <g>
    <rect x="252" y="82" width="216" height="176" rx="14" fill="#ffffff" stroke="#c96f3e" stroke-width="3"/>
    <circle cx="282" cy="112" r="17" fill="#c96f3e"/>
    <text x="282" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <text x="360" y="158" text-anchor="middle" font-size="40">🙉</text>
    <text x="360" y="196" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">NO ADMET</text>
    <text x="360" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">CRÍTICA</text>
    <text x="360" y="246" text-anchor="middle" font-size="16" fill="#6b7a7e" font-style="italic">Mai canvia d'idea.</text>
  </g>

  <g>
    <rect x="482" y="82" width="216" height="176" rx="14" fill="#ffffff" stroke="#c96f3e" stroke-width="3"/>
    <circle cx="512" cy="112" r="17" fill="#c96f3e"/>
    <text x="512" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
    <text x="590" y="158" text-anchor="middle" font-size="40">🎩</text>
    <text x="590" y="196" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">SONA</text>
    <text x="590" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#a24e24">«CIENTÍFICA»</text>
    <text x="590" y="246" text-anchor="middle" font-size="16" fill="#6b7a7e" font-style="italic">Paraules com «quàntic».</text>
  </g>

  <text x="360" y="288" text-anchor="middle" font-size="16" fill="#6b7a7e">A classe el detector té 5 senyals. Tu comences per aquests 3.</text>
</svg>
