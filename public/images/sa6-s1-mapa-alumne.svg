<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Fira Sans Extra Condensed',sans-serif">
  <rect width="720" height="440" fill="#fbfcfd"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="900" fill="#2A3D4C">El teu planeta: encaixa'l i marca-hi les proves</text>
  <ellipse cx="360" cy="245" rx="330" ry="175" fill="#dce8ef" stroke="#b7ccd8" stroke-width="2"/>
  <!-- scattered blank continents (no labels, student works) -->
  <path d="M120 150 L250 140 L240 210 L180 240 L110 210 Z" fill="#e7dcc4" stroke="#b6a077" stroke-width="1.5"/>
  <path d="M300 120 L420 130 L400 200 L320 195 Z" fill="#e7dcc4" stroke="#b6a077" stroke-width="1.5"/>
  <path d="M470 160 L600 150 L610 235 L500 250 L460 205 Z" fill="#e7dcc4" stroke="#b6a077" stroke-width="1.5"/>
  <path d="M200 280 L330 275 L340 350 L230 360 L170 320 Z" fill="#e7dcc4" stroke="#b6a077" stroke-width="1.5"/>
  <path d="M410 285 L540 295 L520 365 L420 355 Z" fill="#e7dcc4" stroke="#b6a077" stroke-width="1.5"/>
  <text x="360" y="432" text-anchor="middle" font-size="12" font-style="italic" fill="#5c7285">Retalla o mou els continents, prova d'encaixar-los i marca on trobes els mateixos fòssils guia (R, F) i les serralades.</text>
