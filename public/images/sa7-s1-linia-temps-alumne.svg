  <text x="24" y="26" font-size="18" font-weight="700" fill="#37306B">La teva línia del temps còsmica</text>
  <text x="24" y="46" font-size="11.5" fill="#5a5580">1 · Calcula la data còsmica de cada fita. &#160;2 · Marca-la amb una ratlla a la banda blanca i posa-hi el número.</text>
  <text x="24" y="62" font-size="11.5" fill="#5a5580">3 · Enganxa la targeta a una fila i uneix-la amb la seva ratlla. Si et cau al desembre, fes-ho a la línia B.</text>
  <text x="24" y="88" font-size="11" font-weight="700" fill="#37306B">A · L'ANY CÒSMIC SENCER &#160;·&#160; 1 mes ≈ 1.150 milions d'anys</text>
