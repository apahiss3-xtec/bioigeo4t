<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Fira Sans Condensed','Fira Sans',sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#5A2E77">Com sé si una cèl·lula s'està dividint?</text>
  <text x="360" y="62" text-anchor="middle" font-size="18" fill="#6b6274">Mira només l'ADN, la part fosca de dins.</text>

  <g>
    <rect x="40" y="84" width="290" height="196" rx="14" fill="#f3e8fa" stroke="#7B3F9E" stroke-width="3"/>
    <circle cx="185" cy="150" r="44" fill="#ffffff" stroke="#c9b3da" stroke-width="2"/>
    <circle cx="185" cy="150" r="28" fill="#cbaede" opacity="0.55"/>
    <text x="185" y="216" text-anchor="middle" font-size="23" font-weight="700" fill="#5A2E77">EN REPÒS</text>
    <text x="185" y="244" text-anchor="middle" font-size="18" fill="#1d1622">L'ADN es veu com</text>
    <text x="185" y="266" text-anchor="middle" font-size="18" fill="#1d1622">un núvol difús.</text>
  </g>

  <g>
    <rect x="390" y="84" width="290" height="196" rx="14" fill="#f6ece8" stroke="#c96f3e" stroke-width="3"/>
    <circle cx="535" cy="150" r="44" fill="#ffffff" stroke="#e0b79c" stroke-width="2"/>
    <g stroke="#8a3d12" stroke-width="6" stroke-linecap="round">
      <line x1="514" y1="132" x2="526" y2="168"/>
      <line x1="530" y1="128" x2="542" y2="166"/>
      <line x1="548" y1="134" x2="556" y2="170"/>
    </g>
    <text x="535" y="216" text-anchor="middle" font-size="23" font-weight="700" fill="#a24e24">ES DIVIDEIX</text>
    <text x="535" y="244" text-anchor="middle" font-size="18" fill="#1d1622">L'ADN es veu com</text>
    <text x="535" y="266" text-anchor="middle" font-size="18" fill="#1d1622">fils foscos separats.</text>
  </g>
</svg>
