<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" font-family="'Fira Sans Extra Condensed','Segoe UI',Arial,sans-serif" role="img" aria-label="Dominància incompleta: vermell per blanc dona rosa; rosa per rosa dona 1 vermell, 2 rosa i 1 blanc">
<rect width="720" height="556" fill="#ffffff"/>
<text x="360" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#17605A">Dominància incompleta: cap al·lel guanya del tot</text>
<text x="360" y="56" text-anchor="middle" font-size="14" fill="#4d6560">V = al·lel «vermell» · B = al·lel «blanc» (cap dels dos domina sobre l'altre)</text>
