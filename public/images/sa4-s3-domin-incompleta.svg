<line x1="150" y1="234" x2="340" y2="262" stroke="#a7cfc7" stroke-width="2"/>
<line x1="570" y1="234" x2="380" y2="262" stroke="#a7cfc7" stroke-width="2"/>
<text x="360" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1622">Tots els fills són ROSA — genotip VB</text>
<text x="360" y="304" text-anchor="middle" font-size="14" fill="#4d6560">l'heterozigot té un fenotip INTERMEDI (ni vermell ni blanc)</text>
