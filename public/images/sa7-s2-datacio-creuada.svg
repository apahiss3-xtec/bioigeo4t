<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="470" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">Un tall de terreny amb dues capes de cendra volcànica</text>
<text x="380" y="46" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a5580">Les dues capes de cendra ja estan datades al laboratori. L'os no s'ha pogut datar directament.</text>
<rect x="160" y="72" width="200" height="58" fill="#d8cfc0" stroke="#5a5580" stroke-width="1.4"/>
<text x="372" y="106" font-size="12.5" fill="#33404b">argila</text>
<rect x="160" y="130" width="200" height="34" fill="#b9b3c9" stroke="#5a5580" stroke-width="1.4"/>
<circle cx="184" cy="147" r="2.4" fill="#6b6486"/>
