<circle cx="298" cy="265" r="2.4" fill="#6b6486"/>
<circle cx="336" cy="265" r="2.4" fill="#6b6486"/>
<text x="372" y="270" font-size="12.5" fill="#33404b">cendra inferior</text>
<rect x="14" y="252" width="130" height="26" rx="6" fill="#fdf7e2" stroke="#c8960a" stroke-width="1.4"/>
<text x="79" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5800">datada: 70 Ma</text>
<line x1="144" y1="265" x2="160" y2="265" stroke="#c8960a" stroke-width="1.6"/>
