<text x="372" y="211" font-size="12.5" fill="#33404b">gres (hi ha l'os)</text>
<rect x="160" y="248" width="200" height="34" fill="#b9b3c9" stroke="#5a5580" stroke-width="1.4"/>
<circle cx="184" cy="265" r="2.4" fill="#6b6486"/>
