<text x="372" y="313" font-size="12.5" fill="#33404b">conglomerat</text>
<path d="M 230 198.0 q 12 -14 26 0 q 14 -9 23 5 q 9 14 -7 18 q -16 7 -28 -2 q -18 2 -14 -21 z" fill="#f7f4ee" stroke="#6b6486" stroke-width="1.6"/>
<text x="372" y="230" font-size="11.5" font-style="italic" fill="#8a3d2c"></text>
<line x1="530" y1="147" x2="530" y2="265" stroke="#37306B" stroke-width="1.8"/>
