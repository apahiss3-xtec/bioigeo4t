<line x1="510" y1="147" x2="521" y2="147" stroke="#37306B" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="521" y1="265" x2="539" y2="265" stroke="#37306B" stroke-width="1.8"/>
<line x1="510" y1="265" x2="521" y2="265" stroke="#37306B" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="552" y="178" width="196" height="56" rx="8" fill="#ffffff" stroke="#37306B" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="650" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#37306B">edat de l'os</text>
<text x="650" y="223" text-anchor="middle" font-size="20" font-weight="700" fill="#b3aed0">?</text>
<text x="360" y="358" text-anchor="middle" font-size="12" font-style="italic" fill="#8a3d2c">L'os no porta cap rellotge que puguem llegir directament.</text>
<rect x="24" y="374" width="712" height="82" rx="8" fill="#f1effa" stroke="#b3aed0" stroke-width="1.4"/>
<text x="38" y="398" font-size="13" font-weight="700" fill="#241F4A">El que ja saps de la SA6 i que aquí et fa falta</text>
<text x="38" y="420" font-size="12.5" fill="#33404b">A la SA6 vas aprendre uns quants principis geològics. Un d'ells diu com s'ordenen en el temps les capes d'un tall no capgirat.</text>
<text x="38" y="442" font-size="12.5" fill="#33404b">Recorda'l: et dona l'ORDRE, però no el NÚMERO. El número el posa la datació de laboratori de les capes que la permeten.</text>
</svg>