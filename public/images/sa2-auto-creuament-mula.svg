<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-labelledby="t d"><title id="t">De l’egua i l’ase a la mula</title><desc id="d">L’egua (2n = 64) i l’ase (2n = 62) fan meiosi. L’òvul i l’espermatozoide porten n = ?. La fecundació els suma i la mula té 2n = ?.</desc><rect width="760" height="276" fill="#fff"/><rect x="14" y="22" width="150" height="88" rx="12" fill="#fdf1f2" stroke="#8E2430" stroke-width="2.2"/><text x="89" y="59" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="16" font-weight="700" fill="#4A2463">Egua</text><text x="89" y="86" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="22" font-weight="800" fill="#8E2430">2n = 64</text><rect x="14" y="166" width="150" height="88" rx="12" fill="#eef4fb" stroke="#173F73" stroke-width="2.2"/><text x="89" y="203" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="16" font-weight="700" fill="#4A2463">Ase</text><text x="89" y="230" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="22" font-weight="800" fill="#173F73">2n = 62</text><line x1="164" y1="66" x2="260.0" y2="66.0" stroke="#8E2430" stroke-width="2.6"/><path d="M268,66 L255.1,59.8 L255.1,72.2 Z" fill="#8E2430"/><line x1="164" y1="210" x2="260.0" y2="210.0" stroke="#173F73" stroke-width="2.6"/><path d="M268,210 L255.1,203.8 L255.1,216.2 Z" fill="#173F73"/><text x="214" y="54" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#8E2430">meiosi</text><text x="214" y="198" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#173F73">meiosi</text><rect x="270" y="22" width="172" height="88" rx