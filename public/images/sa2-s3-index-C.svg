  <rect x="120" y="224" width="480" height="56" rx="12" fill="#f3e8fa" stroke="#7B3F9E" stroke-width="2.5"/>
  <text x="360" y="259" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2E77">que es divideixen &#247; totes &#215; 100 = índex mitòtic</text>
