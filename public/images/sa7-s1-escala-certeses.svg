<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#37306B">L'escala de certeses: quatre nivells, una sola pregunta</text>
  <text x="24" y="50" font-size="13" fill="#5a5580" font-style="italic">La pregunta que decideix el nivell: quina observació concreta la sosté, i quina la desmentiria?</text>

  <!-- gradient bar -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f7d4f"/><stop offset="35%" stop-color="#7d9a34"/>
      <stop offset="68%" stop-color="#E3B04B"/><stop offset="100%" stop-color="#b4463c"/>
    </linearGradient>
  </defs>
  <rect x="24" y="62" width="672" height="9" rx="4.5" fill="url(#g1)"/>
  <text x="24" y="85" font-size="11" fill="#2f7d4f" font-weight="700">MÉS SÒLID</text>
  <text x="696" y="85" font-size="11" fill="#b4463c" font-weight="700" text-anchor="end">MENYS SÒLID</text>

  <!-- 4 cards -->
  <g>
    <rect x="24" y="94" width="162" height="150" rx="9" fill="#eef6f1" stroke="#2f7d4f" stroke-width="1.8"/>
    <rect x="24" y="94" width="162" height="26" rx="9" fill="#2f7d4f"/>
    <rect x="24" y="111" width="162" height="9" fill="#2f7d4f"/>
    <text x="105" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">FET BEN ESTABLERT</text>
    <text x="34" y="140" font-size="12" fill="#243b2f">Moltes proves</text>
    <text x="34" y="156" font-size="12" fill="#243b2f">independents i de</text>
    <text x="34" y="172" font-size="12" fill="#243b2f">tipus diferents hi</text>
    <text x="34" y="188" font-size="12" fill="#243b2f">apunten, i cap</text>
    <text x="34" y="204" font-size="12" fill="#243b2f">resultat seriós hi va</text>
    <text x="34" y="220" font-size="12" fill="#243b2f">en contra.</text>
    <text x="34" y="237" font-size="11" fill="#2f7d4f" font-weight="700">Es pot donar per bo.</text>
  </g>
  <g>
    <rect x="196" y="94" width="162" height="150" rx="9" fill="#f4f7e8" stroke="#7d9a34" stroke-width="1.8"/>
    <rect x="196" y="94" width="162" height="26" rx="9" fill="#7d9a34"/>
    <rect x="196" y="111" width="162" height="9" fill="#7d9a34"/>
    <text x="277" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">HIPÒTESI AMB PROVES</text>
    <text x="206" y="140" font-size="12" fill="#33401f">Hi ha indicis a favor,</text>
    <text x="206" y="156" font-size="12" fill="#33401f">però encara són</text>
    <text x="206" y="172" font-size="12" fill="#33401f">febles o no s'han</text>
    <text x="206" y="188" font-size="12" fill="#33401f">confirmat de manera</text>
    <text x="206" y="204" font-size="12" fill="#33401f">independent.</text>
    <text x="206" y="228" font-size="11" fill="#5f7726" font-weight="700">És on la ciència</text>
    <text x="206" y="240" font-size="11" fill="#5f7726" font-weight="700">treballa ara mateix.</text>
  </g>
  <g>
    <rect x="368" y="94" width="162" height="150" rx="9" fill="#fdf6e4" stroke="#E3B04B" stroke-width="1.8"/>
    <rect x="368" y="94" width="162" height="26" rx="9" fill="#c99226"/>
    <rect x="368" y="111" width="162" height="9" fill="#c99226"/>
    <text x="449" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ESPECULACIÓ</text>
    <text x="378" y="140" font-size="12" fill="#4a3b12">És possible i no</text>
    <text x="378" y="156" font-size="12" fill="#4a3b12">contradiu res del que</text>
    <text x="378" y="172" font-size="12" fill="#4a3b12">sabem, però ara</text>
    <text x="378" y="188" font-size="12" fill="#4a3b12">mateix no hi ha cap</text>
    <text x="378" y="204" font-size="12" fill="#4a3b12">prova que hi apunti.</text>
    <text x="378" y="228" font-size="11" fill="#8a6410" font-weight="700">Es pot dir, però dient</text>
    <text x="378" y="240" font-size="11" fill="#8a6410" font-weight="700">que ho és.</text>
  </g>
  <g>
    <rect x="540" y="94" width="156" height="150" rx="9" fill="#fbeceb" stroke="#b4463c" stroke-width="1.8"/>
    <rect x="540" y="94" width="156" height="26" rx="9" fill="#b4463c"/>
    <rect x="540" y="111" width="156" height="9" fill="#b4463c"/>
    <text x="618" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">NO CIENTÍFICA</text>
    <text x="550" y="140" font-size="12" fill="#4a201d">Està formulada de</text>
    <text x="550" y="156" font-size="12" fill="#4a201d">manera que cap</text>
    <text x="550" y="172" font-size="12" fill="#4a201d">observació la podria</text>
    <text x="550" y="188" font-size="12" fill="#4a201d">desmentir mai, o va</text>
    <text x="550" y="204" font-size="12" fill="#4a201d">contra proves sòlides.</text>
    <text x="550" y="228" font-size="11" fill="#8c322a" font-weight="700">No es pot posar a</text>
    <text x="550" y="240" font-size="11" fill="#8c322a" font-weight="700">prova.</text>
  </g>

  <!-- worked example (off-topic on purpose) -->
  <rect x="24" y="262" width="672" height="184" rx="10" fill="#f6f5fb" stroke="#37306B" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="40" y="285" font-size="12.5" font-weight="700" fill="#37306B">EXEMPLE RESOLT · d'un tema que NO surt a les vuit afirmacions de la fitxa</text>
  <text x="40" y="308" font-size="13" fill="#1a2027" font-style="italic">Afirmació analitzada: «fumar augmenta el risc de càncer de pulmó».</text>

  <rect x="40" y="320" width="200" height="110" rx="8" fill="#ffffff" stroke="#b9b4d2"/>
  <text x="52" y="340" font-size="11" font-weight="700" fill="#37306B">1 · QUÈ S'OBSERVA</text>
  <text x="52" y="358" font-size="11.5" fill="#33404b">Milers d'estudis, en països</text>
  <text x="52" y="373" font-size="11.5" fill="#33404b">i èpoques diferents, troben</text>
  <text x="52" y="388" font-size="11.5" fill="#33404b">més casos entre fumadors, i</text>
  <text x="52" y="403" font-size="11.5" fill="#33404b">al laboratori se'n coneix el</text>
  <text x="52" y="418" font-size="11.5" fill="#33404b">mecanisme cel·lular.</text>

  <rect x="256" y="320" width="200" height="110" rx="8" fill="#ffffff" stroke="#b9b4d2"/>
  <text x="268" y="340" font-size="11" font-weight="700" fill="#37306B">2 · QUÈ LA DESMENTIRIA</text>
  <text x="268" y="358" font-size="11.5" fill="#33404b">Que estudis grans i ben fets</text>
  <text x="268" y="373" font-size="11.5" fill="#33404b">no trobessin cap diferència</text>
  <text x="268" y="388" font-size="11.5" fill="#33404b">entre fumadors i no</text>
  <text x="268" y="403" font-size="11.5" fill="#33404b">fumadors. Es podria fer, i</text>
  <text x="268" y="418" font-size="11.5" fill="#33404b">no ha passat mai.</text>

  <rect x="472" y="320" width="200" height="110" rx="8" fill="#eef6f1" stroke="#2f7d4f" stroke-width="1.6"/>
  <text x="484" y="340" font-size="11" font-weight="700" fill="#2f7d4f">3 · NIVELL I PER QUÈ</text>
  <text x="484" y="358" font-size="11.5" fill="#243b2f" font-weight="700">Fet ben establert.</text>
  <text x="484" y="376" font-size="11.5" fill="#243b2f">Perquè hi ha proves de</text>
  <text x="484" y="391" font-size="11.5" fill="#243b2f">tipus diferents (estadística</text>
  <text x="484" y="406" font-size="11.5" fill="#243b2f">i mecanisme), es podria</text>
  <text x="484" y="421" font-size="11.5" fill="#243b2f">desmentir i no s'ha desmentit.</text>

  <text x="360" y="461" font-size="11" fill="#6a6488" text-anchor="middle" font-style="italic">Aquest és el nivell de detall que s'espera de cada afirmació: no n'hi ha prou de dir el nivell, cal dir la prova.</text>
</svg>
