<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Fira Sans Extra Condensed','Segoe UI',sans-serif">
  <defs>
    <style>
      .ink{fill:#16302c}.mut{fill:#4d6560}
      .hd{font-size:20px;font-weight:800;fill:#ffffff}
      .lbl{font-size:14px;fill:#16302c}.sm{font-size:13px;fill:#4d6560}
      .coinA{fill:#1E7A70;stroke:#17605A;stroke-width:2}
      .coina{fill:#ffffff;stroke:#17605A;stroke-width:2}
      .cface{font-size:18px;font-weight:800;fill:#ffffff}
      .cfacea{font-size:18px;font-weight:800;fill:#17605A}
      .axis{stroke:#7fbdb2;stroke-width:1.5}
      .bar{fill:#46B3A6}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="46" fill="#1E7A70"/>
  <text x="24" y="30" class="hd">Simular l'herència amb monedes: l'atzar de cada gàmeta</text>

  <!-- ==== LEFT: coin = gamete ==== -->
  <g transform="translate(30,70)">
    <rect x="0" y="0" width="330" height="150" rx="12" fill="#EAF5F2" stroke="#bfe0d9" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="800" fill="#17605A" letter-spacing="1">1 MONEDA = 1 PROGENITOR Aa</text>
    <circle cx="54" cy="76" r="28" class="coinA"/><text x="54" y="83" text-anchor="middle" class="cface">A</text>
    <text x="54" y="126" text-anchor="middle" class="sm">cara → passa A</text>
    <circle cx="158" cy="76" r="28" class="coina"/><text x="158" y="83" text-anchor="middle" class="cfacea">a</text>
    <text x="158" y="126" text-anchor="middle" class="sm">creu → passa a</text>
    <text x="222" y="64" class="lbl">Cada progenitor</text>
    <text x="222" y="83" class="lbl">Aa dona A o a</text>
    <text x="222" y="102" class="lbl">al 50 % (atzar).</text>
  </g>

  <!-- ==== LEFT-BOTTOM: two coins = one child ==== -->
  <g transform="translate(30,240)">
    <rect x="0" y="0" width="330" height="158" rx="12" fill="#fdf7e2" stroke="#e7dca8" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="800" fill="#7a5800" letter-spacing="1">2 MONEDES ALHORA = 1 FILL/A</text>
    <circle cx="60" cy="76" r="26" class="coinA"/><text x="60" y="83" text-anchor="middle" class="cface">A</text>
    <text x="103" y="82" font-size="22" font-weight="800" fill="#7a5800">+</text>
    <circle cx="146" cy="76" r="26" class="coina"/><text x="146" y="83" text-anchor="middle" class="cfacea">a</text>
    <text x="188" y="82" font-size="22" font-weight="800" fill="#7a5800">&#8594;</text>
    <rect x="222" y="52" width="90" height="48" rx="8" fill="#ffffff" stroke="#c8960a" stroke-width="2"/>
    <text x="267" y="84" text-anchor="middle" font-size="22" font-weight="800" fill="#16302c">Aa</text>
    <text x="16" y="128" class="sm">Tira les dues monedes i apunta el genotip.</text>
    <text x="16" y="146" class="sm">Repeteix-ho moltes vegades.</text>
  </g>

  <!-- ==== RIGHT: chance vs tendency chart ==== -->
  <g transform="translate(400,70)">
    <rect x="0" y="0" width="330" height="328" rx="12" fill="#ffffff" stroke="#cfe6e0" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="800" fill="#17605A" letter-spacing="1">ATZAR vs TENDÈNCIA</text>
    <text x="16" y="45" class="sm">% de fenotip dominant observat · <tspan font-style="italic">dades d'exemple</tspan></text>
    <!-- target line at 75% -->
    <line x1="40" y1="107.5" x2="310" y2="107.5" stroke="#c96f3e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="46" y="101.5" font-size="11.5" fill="#a24e24">esperat 75 % (3:1)</text>
    <!-- axis -->
    <line x1="40" y1="56" x2="40" y2="250" class="axis"/>
    <line x1="40" y1="250" x2="310" y2="250" class="axis"/>
    <line x1="36" y1="250.0" x2="40" y2="250.0" class="axis"/><text x="33" y="254.0" text-anchor="end" font-size="11.5" fill="#4d6560">0</text>
    <line x1="36" y1="202.5" x2="40" y2="202.5" class="axis"/><text x="33" y="206.5" text-anchor="end" font-size="11.5" fill="#4d6560">25</text>
    <line x1="36" y1="155.0" x2="40" y2="155.0" class="axis"/><text x="33" y="159.0" text-anchor="end" font-size="11.5" fill="#4d6560">50</text>
    <line x1="36" y1="107.5" x2="40" y2="107.5" class="axis"/><text x="33" y="111.5" text-anchor="end" font-size="11.5" fill="#4d6560">75</text>
    <line x1="36" y1="60.0" x2="40" y2="60.0" class="axis"/><text x="33" y="64.0" text-anchor="end" font-size="11.5" fill="#4d6560">100</text>
    <rect x="60" y="155.0" width="34" height="95.0" class="bar" opacity="0.55"/>
    <text x="77" y="172.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10332f">50 %</text>
    <rect x="118" y="174.0" width="34" height="76.0" class="bar" opacity="0.6"/>
    <text x="135" y="191.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10332f">40 %</text>
    <rect x="176" y="121.8" width="34" height="128.2" class="bar" opacity="0.75"/>
    <text x="193" y="138.8" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10332f">67,5 %</text>
    <rect x="234" y="109.4" width="34" height="140.6" class="bar"/>
    <text x="251" y="126.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10332f">74 %</text>
    <text x="77" y="266" text-anchor="middle" class="sm">4</text>
    <text x="135" y="266" text-anchor="middle" class="sm">10</text>
    <text x="193" y="266" text-anchor="middle" class="sm">40</text>
    <text x="251" y="266" text-anchor="middle" class="sm">100</text>
    <text x="175" y="285" text-anchor="middle" class="sm">nombre de tirades (fills simulats)</text>
    <text x="16" y="306" class="sm">Amb <tspan font-weight="700" fill="#17605A">poques</tspan> tirades el % balla molt;</text>
    <text x="16" y="322" class="sm">amb <tspan font-weight="700" fill="#17605A">moltes</tspan>, s'acosta al 75 %.</text>
  </g>
</svg>
