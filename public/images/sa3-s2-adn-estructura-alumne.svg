  <text x="210" y="392" text-anchor="middle" font-size="15" fill="#333">Regla que has fet servir: <tspan fill="#9aa">________________________</tspan></text>

  <rect x="400" y="100" width="480" height="150" rx="14" fill="#ffffff" stroke="#2E7D57" stroke-width="2.5"/>
  <text x="640" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#2E7D57">Per que DUES cadenes i no una?</text>
