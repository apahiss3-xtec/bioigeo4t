  <line x1="424" y1="190" x2="856" y2="190" stroke="#c9e0d3" stroke-width="1.4"/>
  <line x1="424" y1="220" x2="856" y2="220" stroke="#c9e0d3" stroke-width="1.4"/>
  <text x="640" y="272" text-anchor="middle" font-size="15" fill="#555">Pista: pensa en la mitosi de SA2 — la cel.lula ha de COPIAR l'ADN abans de dividir-se.</text>

  <rect x="400" y="292" width="480" height="100" rx="14" fill="#ffffff" stroke="#7B3F9E" stroke-width="2.5"/>
  <text x="640" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#7B3F9E">Si l'ADN fos d'UNA sola cadena, que es perdria?</text>
