<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Fira Sans Extra Condensed',sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#fdfefe"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="900" fill="#2A3D4C">Ordena tu la història d'aquesta columna</text>

  <g>
    <rect x="120" y="330" width="150" height="55" fill="#2f6f8a" stroke="#1f2d36"/>
    <rect x="120" y="275" width="150" height="55" fill="#c9a24a" stroke="#1f2d36"/>
    <rect x="120" y="220" width="150" height="55" fill="#7a6a55" stroke="#1f2d36"/>
    <rect x="120" y="165" width="150" height="55" fill="#9a9a9a" stroke="#1f2d36"/>
    <rect x="120" y="110" width="150" height="55" fill="#8a9a4a" stroke="#1f2d36"/>
    <text x="195" y="362" text-anchor="middle" font-size="16">🐚</text>
    <text x="195" y="252" text-anchor="middle" font-size="16">🌿</text>
    <text x="195" y="142" text-anchor="middle" font-size="16">🦴</text>
  </g>

  <line x1="95" y1="110" x2="95" y2="385" stroke="#3A5266" stroke-width="2" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3A5266"/></marker></defs>

  <!-- empty circles + layer descriptions to number -->
  <g font-size="12.5" fill="#33404b">
    <circle cx="300" cy="137" r="11" fill="#fff" stroke="#3A5266" stroke-width="1.5"/>
    <text x="320" y="141">Sòl amb ossos de mamífers terrestres</text>
    <circle cx="300" cy="192" r="11" fill="#fff" stroke="#3A5266" stroke-width="1.5"/>
    <text x="320" y="196">Capa de cendra volcànica</text>
    <circle cx="300" cy="247" r="11" fill="#fff" stroke="#3A5266" stroke-width="1.5"/>
    <text x="320" y="251">Fulles i troncs fòssils</text>
    <circle cx="300" cy="302" r="11" fill="#fff" stroke="#3A5266" stroke-width="1.5"/>
    <text x="320" y="306">Sorra de riu</text>
    <circle cx="300" cy="357" r="11" fill="#fff" stroke="#3A5266" stroke-width="1.5"/>
    <text x="320" y="361">Conquilles marines</text>
  </g>
  <text x="360" y="405" text-anchor="middle" font-size="12" font-style="italic" fill="#5c7285">Escriu 1 a la capa més antiga i 5 a la més recent. Pista: el que és a sota és més antic.</text>
