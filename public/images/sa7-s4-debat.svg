<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="430" fill="#ffffff"/>
<rect x="0" y="0" width="760" height="34" fill="#37306B"/>
<text x="16" y="23" fill="#ffffff" font-size="16" font-weight="700">Com funciona el debat &#183; 22 minuts</text>
<text x="744" y="23" fill="#E3B04B" font-size="12" text-anchor="end">no és guanyar: és pensar</text>

<line x1="40" y1="62" x2="720" y2="62" stroke="#bdb7d6" stroke-width="2"/>
<circle cx="107" cy="62" r="9" fill="#37306B"/><text x="107" y="66" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">1</text>
<circle cx="243" cy="62" r="9" fill="#37306B"/><text x="243" y="66" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">2</text>
<circle cx="379" cy="62" r="9" fill="#4a6fa5"/><text x="379" y="66" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">3</text>
<circle cx="515" cy="62" r="9" fill="#B0821F"/><text x="515" y="66" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">4</text>
<circle cx="651" cy="62" r="9" fill="#c8960a"/><text x="651" y="66" fill="#fff" font-size="11" font-weight="900" text-anchor="middle">5</text>

<rect x="43" y="82" width="128" height="96" rx="7" fill="#f1effa" stroke="#37306B" stroke-width="1.4"/>
<text x="107" y="100" font-size="11" font-weight="900" fill="#241F4A" text-anchor="middle">OBERTURA</text>
<text x="107" y="114" font-size="11" font-weight="900" fill="#241F4A" text-anchor="middle">A FAVOR</text>
<text x="107" y="132" font-size="12.5" fill="#33404b" text-anchor="middle">3 min</text>
<text x="107" y="151" font-size="11.5" fill="#1a2027" text-anchor="middle">Un argument de</text>
<text x="107" y="166" font-size="11.5" fill="#1a2027" text-anchor="middle">dades i un de valors</text>

<rect x="179" y="82" width="128" height="96" rx="7" fill="#f1effa" stroke="#37306B" stroke-width="1.4"/>
<text x="243" y="100" font-size="11" font-weight="900" fill="#241F4A" text-anchor="middle">OBERTURA</text>
<text x="243" y="114" font-size="11" font-weight="900" fill="#241F4A" text-anchor="middle">EN CONTRA</text>
<text x="243" y="132" font-size="12.5" fill="#33404b" text-anchor="middle">3 min</text>
<text x="243" y="151" font-size="11.5" fill="#1a2027" text-anchor="middle">El mateix, però</text>
<text x="243" y="166" font-size="11.5" fill="#1a2027" text-anchor="middle">des de l'altra banda</text>

<rect x="315" y="82" width="128" height="96" rx="7" fill="#eaf0f9" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="379" y="100" font-size="11" font-weight="900" fill="#31527e" text-anchor="middle">RÈPLICA</text>
<text x="379" y="114" font-size="11" font-weight="900" fill="#31527e" text-anchor="middle">CREUADA</text>
<text x="379" y="132" font-size="12.5" fill="#33404b" text-anchor="middle">8 min</text>
<text x="379" y="151" font-size="11.5" fill="#1a2027" text-anchor="middle">Respon l'argument</text>
<text x="379" y="166" font-size="11.5" fill="#1a2027" text-anchor="middle">de l'altre, no el teu</text>

<rect x="451" y="82" width="128" height="96" rx="7" fill="#fdf6e6" stroke="#B0821F" stroke-width="1.4"/>
<text x="515" y="100" font-size="11" font-weight="900" fill="#8a6410" text-anchor="middle">CANVI</text>
<text x="515" y="114" font-size="11" font-weight="900" fill="#8a6410" text-anchor="middle">DE CADIRA</text>
<text x="515" y="132" font-size="12.5" fill="#33404b" text-anchor="middle">5 min</text>
<text x="515" y="151" font-size="11.5" fill="#1a2027" text-anchor="middle">Defenses la postura</text>
<text x="515" y="166" font-size="11.5" fill="#1a2027" text-anchor="middle">contrària a la teva</text>

<rect x="587" y="82" width="128" height="96" rx="7" fill="#fdf7e2" stroke="#c8960a" stroke-width="1.4"/>
<text x="651" y="100" font-size="11" font-weight="900" fill="#7a5800" text-anchor="middle">TANCAMENT</text>
<text x="651" y="132" font-size="12.5" fill="#33404b" text-anchor="middle">3 min</text>
<text x="651" y="151" font-size="11.5" fill="#1a2027" text-anchor="middle">Què m'ha fet</text>
<text x="651" y="166" font-size="11.5" fill="#1a2027" text-anchor="middle">dubtar de debò</text>

<rect x="43" y="200" width="672" height="98" rx="8" fill="#fdfefe" stroke="#bdb7d6" stroke-width="1.6"/>
<text x="59" y="220" font-size="13" font-weight="900" fill="#241F4A">QUI FA QUÈ</text>
<text x="59" y="242" font-size="12.5" fill="#1a2027">&#9679; <tspan font-weight="700">Dues persones per banda</tspan> tenen un encàrrec: el <tspan font-weight="700">portaveu</tspan>, que parla als torns 1, 2 i 5,</text>
<text x="72" y="260" font-size="12.5" fill="#1a2027">i el <tspan font-weight="700">rellotge</tspan>, que avisa 30 segons abans de cada final de torn.</text>
<text x="59" y="282" font-size="12.5" fill="#1a2027">&#9679; <tspan font-weight="700">Tothom</tspan> va omplint les dues taules de la seva fitxa (dades i valors) mentre escolta.</text>

<rect x="43" y="312" width="672" height="102" rx="8" fill="#fbeceb" stroke="#b4463c" stroke-width="1.6"/>
<text x="59" y="332" font-size="13" font-weight="900" fill="#4a201d">TRES REGLES QUE ES FAN COMPLIR</text>
<text x="59" y="354" font-size="12.5" fill="#4a201d">1. Si dius una <tspan font-weight="700">dada</tspan>, digues d'on la treus. Si no ho recordes, avisa: &#171;em sembla que&#8230;&#187;</text>
<text x="59" y="375" font-size="12.5" fill="#4a201d">2. Abans de contestar un argument, repeteix-lo. Així no respons el que t'hauria agradat sentir.</text>
<text x="59" y="396" font-size="12.5" fill="#4a201d">3. Tothom de la banda parla com a mínim un cop entre els torns 1 i 5.</text>
</svg>
