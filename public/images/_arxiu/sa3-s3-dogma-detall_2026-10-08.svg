<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Fira Sans Extra Condensed','Fira Sans Condensed','Segoe UI',Arial,sans-serif">
<defs>
 <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22357A"/></marker>
</defs>
<rect width="900" height="480" fill="#fff"/>
<text x="450" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#22357A">El camí de l'ADN a la proteïna</text>
<!-- citoplasma bg -->
<rect x="10" y="44" width="880" height="426" rx="18" fill="#f7f9fe" stroke="#c9d3f0"/>
<text x="870" y="66" text-anchor="end" font-size="15" font-weight="700" fill="#5B7BE0" letter-spacing="1">CITOPLASMA</text>
<!-- nucli -->
<rect x="26" y="74" width="420" height="300" rx="26" fill="#e9eefc" stroke="#2E4A9E" stroke-width="2.5" stroke-dasharray="0"/>
<rect x="440" y="268" width="12" height="34" fill="#e9eefc"/>
<text x="446" y="262" text-anchor="middle" font-size="10.5" fill="#2E4A9E">porus</text>
<text x="46" y="100" font-size="15" font-weight="700" fill="#2E4A9E" letter-spacing="1">NUCLI</text>
<!-- DNA two strands -->
<text x="60" y="126" font-size="12" fill="#2E4A9E">cadena codificant</text>
<line x1="60" y1="136" x2="420" y2="136" stroke="#2E4A9E" stroke-width="5" stroke-linecap="round"/>
<text x="170" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">A</text><text x="187" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">T</text><text x="204" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">G</text><text x="221" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">G</text><text x="238" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">T</text><text x="255" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">G</text><text x="272" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">C</text><text x="289" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">A</text><text x="306" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#2E4A9E">C</text>
<line x1="60" y1="202" x2="420" y2="202" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
<text x="170" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">T</text><text x="187" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">A</text><text x="204" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">C</text><text x="221" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">C</text><text x="238" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">A</text><text x="255" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">C</text><text x="272" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">G</text><text x="289" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">T</text><text x="306" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a2b">G</text>
<text x="60" y="222" font-size="12" fill="#8a5a2b">cadena motlle</text>
<!-- rungs outside bubble -->
<line x1="80" y1="138" x2="80" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="100" y1="138" x2="100" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="120" y1="138" x2="120" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="140" y1="138" x2="140" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="340" y1="138" x2="340" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="360" y1="138" x2="360" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="380" y1="138" x2="380" y2="200" stroke="#9fb0de" stroke-width="2"/><line x1="400" y1="138" x2="400" y2="200" stroke="#9fb0de" stroke-width="2"/>
<!-- polymerase -->
<ellipse cx="238" cy="204" rx="92" ry="30" fill="#2E7D57" opacity=".18" stroke="#2E7D57" stroke-width="1.5"/>
<text x="238" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D57">ARN polimerasa</text>
<!-- mRNA -->
<path d="M150 262 C 220 262, 300 262, 380 262 C 420 262, 440 285, 470 285" fill="none" stroke="#2E7D57" stroke-width="5" stroke-linecap="round"/>
<text x="170" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">A</text><text x="187" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">U</text><text x="204" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">G</text><text x="221" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">G</text><text x="238" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">U</text><text x="255" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">G</text><text x="272" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">C</text><text x="289" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">A</text><text x="306" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">C</text>
<text x="150" y="304" font-size="12.5" font-weight="700" fill="#2E7D57">ARN missatger (ARNm)</text>
<text x="46" y="334" font-size="15" font-weight="800" fill="#2E7D57">① TRANSCRIPCIÓ</text>
<text x="46" y="352" font-size="12.5" fill="#333">l'ARN polimerasa llegeix la cadena motlle</text>
<text x="46" y="367" font-size="12.5" fill="#333">i fabrica l'ARNm per complementarietat</text>
<!-- mRNA in cytoplasm -->
<line x1="470" y1="285" x2="860" y2="285" stroke="#2E7D57" stroke-width="5" stroke-linecap="round"/>
<text x="600" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">A</text><text x="616" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">U</text><text x="632" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">G</text><text x="648" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">G</text><text x="664" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">U</text><text x="680" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">G</text><text x="696" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">C</text><text x="712" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">A</text><text x="728" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">C</text><text x="744" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">C</text><text x="760" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">U</text><text x="776" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D57">G</text>
<!-- ribosome -->
<ellipse cx="670" cy="296" rx="62" ry="22" fill="#6fae8c" opacity=".55"/>
<ellipse cx="670" cy="258" rx="74" ry="30" fill="#6fae8c" opacity=".35" stroke="#2E7D57"/>
<text x="670" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f5c3f">ribosoma</text>
<!-- tRNA on codon GUG (positions 3..5 at x=648..680) -->
<g>
 <path d="M656 250 L656 236 C 634 240, 626 214, 646 210 C 630 196, 648 180, 662 192 L 674 192 C 688 180, 706 196, 690 210 C 710 214, 702 240, 680 236 L680 250 Z" fill="#f3d2c2" stroke="#B5502A" stroke-width="2"/><line x1="668" y1="192" x2="668" y2="199" stroke="#B5502A" stroke-width="2"/>
 <rect x="640" y="252" width="56" height="16" rx="4" fill="#fff" stroke="#B5502A"/>
 <text x="652" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#B5502A">C</text><text x="668" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#B5502A">A</text><text x="684" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#B5502A">C</text>
 <circle cx="668" cy="186" r="13" fill="#e8a24b" stroke="#b5502a"/>
 <text x="668" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5a2a10">Val</text>
</g>
<text x="712" y="258" font-size="11.5" fill="#B5502A">ARNt</text>
<text x="712" y="272" font-size="11" fill="#B5502A">(anticodó)</text>
<!-- growing chain -->
<circle cx="640" cy="168" r="13" fill="#e8a24b" stroke="#b5502a"/><text x="640" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5a2a10">Met</text>
<line x1="652" y1="174" x2="658" y2="180" stroke="#b5502a" stroke-width="2"/>
<text x="624" y="160" text-anchor="end" font-size="12" fill="#7a4a1a">aminoàcids →</text>
<text x="486" y="362" font-size="15" font-weight="800" fill="#B5502A">② TRADUCCIÓ</text>
<text x="486" y="380" font-size="12.5" fill="#333">el ribosoma llegeix l'ARNm de 3 en 3 (codons);</text>
<text x="486" y="395" font-size="12.5" fill="#333">cada ARNt hi encaixa amb el seu anticodó i hi deixa 1 aminoàcid</text>
<!-- protein -> characteristic -->
<g transform="translate(560,96)">
 <path d="M0 20 C 20 -6, 40 40, 60 14 C 80 -10, 96 30, 116 10" fill="none" stroke="#e8a24b" stroke-width="10" stroke-linecap="round"/>
 <text x="58" y="-8" text-anchor="middle" font-size="13" font-weight="700" fill="#B5502A">proteïna</text>
</g>
<line x1="686" y1="108" x2="742" y2="108" stroke="#22357A" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="760" y="104" font-size="14" font-weight="800" fill="#7B3F9E">CARACTERÍSTICA</text>
<text x="760" y="120" font-size="11.5" fill="#555">p. ex. glòbul vermell</text>
<text x="760" y="134" font-size="11.5" fill="#555">que porta oxigen</text>
<text x="450" y="455" text-anchor="middle" font-size="13" fill="#22357A" font-style="italic">L'ARNm té les mateixes lletres que la cadena codificant, amb U en lloc de T.</text>
</svg>