<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Fira Sans Extra Condensed','Fira Sans Condensed','Segoe UI',Arial,sans-serif"><rect width="960" height="360" fill="#fff"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22357A"/></marker><mask id="cr"><rect width="960" height="360" fill="#fff"/><circle cx="868" cy="142" r="30" fill="#000"/></mask></defs><text x="480.0" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#22357A">Casgevy (2023): la primera teràpia amb CRISPR aprovada</text><rect x="15" y="60" width="210" height="190" rx="16" fill="#f7f9fe" stroke="#2E4A9E" stroke-width="2"/><text x="120" y="276" text-anchor="middle" font-size="16" font-weight="800" fill="#2E4A9E">1 · Extreure</text><text x="120" y="296" text-anchor="middle" font-size="13" fill="#444">cèl·lules mare de la</text><text x="120" y="312" text-anchor="middle" font-size="13" fill="#444">medul·la del pacient</text><text x="120" y="328" text-anchor="middle" font-size="13" fill="#444">(on es fabrica la sang)</text><line x1="228" y1="150" x2="250" y2="150" stroke="#22357A" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="60" width="210" height="190" rx="16" fill="#f7f9fe" stroke="#2E7D57" stroke-width="2"/><text x="360" y="276" text-anchor="middle" font-size="16" font-weight="800" fill="#2E7D57">2 · Editar al laboratori</text><text x="360" y="296" text-anchor="middle" font-size="13" fill="#444">CRISPR desactiva el gen</text><text x="360" y="312" text-anchor="middle" font-size="13" fill="#444">«fre» BCL11A</text><text x="360" y="328" text-anchor="middle" font-size="13" fill="#444"></text><line x1="468" y1="150" x2="490" y2="150" stroke="#22357A" stroke-width="2.5" marker-end="url(#ar)"/><rect x="495" y="60" width="210" height="190" rx="16" fill="#f7f9fe" stroke="#B5502A" stroke-width="2"/><text x="600" y="276" text-anchor="middle" font-size="16" font-weight="800" fill="#B5502A">3 · Tornar-les al cos</text><text x="600" y="296" text-anchor="middle" font-size="13" fill="#444">el pacient rep quimioteràpia</text><text x="600" y="312" text-anchor="middle" font-size="13" fill="#444">i se li tornen a posar</text><text x="600" y="328" text-anchor="middle" font-size="13" fill="#444">les seves cèl·lules editades</text><line x1="708" y1="150" x2="730" y2="150" stroke="#22357A" stroke-width="2.5" marker-end="url(#ar)"/><rect x="735" y="60" width="210" height="190" rx="16" fill="#f7f9fe" stroke="#7B3F9E" stroke-width="2"/><text x="840" y="276" text-anchor="middle" font-size="16" font-weight="800" fill="#7B3F9E">4 · Resultat</text><text x="840" y="296" text-anchor="middle" font-size="13" fill="#444">els glòbuls vermells nous</text><text x="840" y="312" text-anchor="middle" font-size="13" fill="#444">fabriquen hemoglobina fetal</text><text x="840" y="328" text-anchor="middle" font-size="13" fill="#444">i no es tornen falç</text><path d="M60 130 q-14 -18 4 -26 q14 -4 18 10 L158 114 q4 -14 18 -10 q18 8 4 26 q14 18 -4 26 q-14 4 -18 -10 L82 152 q-4 14 -18 10 q-18 -8 -4 -26z" fill="#f3ead7" stroke="#b39b6b" stroke-width="2"/><circle cx="90" cy="190" r="9" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="110" cy="190" r="9" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="130" cy="190" r="9" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="150" cy="190" r="9" fill="#d9b3e8" stroke="#7B3F9E"/><text x="120" y="222" text-anchor="middle" font-size="11.5" fill="#7B3F9E">cèl·lules mare</text><line x1="280" y1="130" x2="440" y2="130" stroke="#2E4A9E" stroke-width="6"/><line x1="280" y1="154" x2="440" y2="154" stroke="#8a5a2b" stroke-width="6"/><rect x="326" y="118" width="68" height="48" rx="6" fill="#fbe3e3" stroke="#c0392b" stroke-width="2"/><text x="360" y="148" text-anchor="middle" font-size="13" font-weight="800" fill="#a0281c">BCL11A</text><line x1="320" y1="176" x2="400" y2="100" stroke="#c0392b" stroke-width="4"/><text x="360" y="200" text-anchor="middle" font-size="12.5" fill="#2E7D57" font-weight="700">✂ tall amb CRISPR-Cas9</text><text x="360" y="218" text-anchor="middle" font-size="11.5" fill="#555">el «fre» deixa de funcionar</text><rect x="576" y="94" width="48" height="62" rx="10" fill="#fbeee0" stroke="#B5502A" stroke-width="2"/><circle cx="590" cy="110" r="6" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="608" cy="120" r="6" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="594" cy="134" r="6" fill="#d9b3e8" stroke="#7B3F9E"/><circle cx="610" cy="142" r="6" fill="#d9b3e8" stroke="#7B3F9E"/><path d="M600 156 C 600 180, 630 180, 640 200" stroke="#B5502A" stroke-width="3" fill="none"/><circle cx="646" cy="208" r="10" fill="#B5502A"/><circle cx="810" cy="140" r="26" fill="#e2575c"/><ellipse cx="810" cy="140" rx="14" ry="10" fill="#c23b41" opacity=".6"/><circle cx="862" cy="124" r="26" fill="#e2575c"/><ellipse cx="862" cy="124" rx="14" ry="10" fill="#c23b41" opacity=".6"/><circle cx="844" cy="176" r="26" fill="#e2575c"/><ellipse cx="844" cy="176" rx="14" ry="10" fill="#c23b41" opacity=".6"/><text x="480.0" y="352" text-anchor="middle" font-size="13" fill="#22357A" font-style="italic">Edició somàtica: el canvi es queda en el pacient i no passa als fills. La lletra de la falciforme continua allà; el que canvia és quina hemoglobina es fabrica.</text></svg>