<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" font-family="Fira Sans Extra Condensed, Arial Narrow, sans-serif">
  <rect x="0" y="0" width="780" height="200" fill="#ffffff"/>
  <text x="390" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#2A3D4C">Els tres indrets, de la muntanya al mar</text>
  <text x="390" y="39" text-anchor="middle" font-size="12" fill="#5c7285">Perfil esquemàtic de les Terres de l'Ebre (no és a escala ni és un mapa)</text>

  <rect x="18" y="50" width="744" height="106" fill="#eaf3f8"/>
  <!-- muntanya -->
  <path d="M18 156 L18 96 L96 60 L200 130 L280 156 Z" fill="#9aa9a0"/>
  <path d="M18 156 L18 96 L96 60 L128 84 L60 156 Z" fill="#8496a0" opacity="0.45"/>
  <!-- arbres cremats -->
  <g stroke="#4a3a2a" stroke-width="2.5" stroke-linecap="round">
    <path d="M96 100 L96 84"/><path d="M96 90 l-7 -6 M96 90 l7 -6"/>
    <path d="M124 116 L124 100"/><path d="M124 106 l-7 -6 M124 106 l7 -6"/>
    <path d="M152 132 L152 116"/><path d="M152 122 l-7 -6 M152 122 l7 -6"/>
  </g>
  <!-- plana i riu -->
  <path d="M280 156 L560 156 L560 144 L280 144 Z" fill="#efe7d4"/>
  <path d="M198 128 C 260 146, 320 148, 420 150 L560 150 L560 156 L200 156 Z" fill="#6fa3bd" opacity="0.85"/>
  <text x="330" y="140" text-anchor="middle" font-size="11.5" fill="#2f6f8a">riu Ebre</text>
  <!-- delta -->
  <path d="M560 144 L672 146 L672 158 L560 158 Z" fill="#c8b489"/>
  <text x="616" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b5b34">delta</text>
  <!-- mar -->
  <rect x="672" y="146" width="90" height="10" fill="#7fbdd8"/>
  <rect x="672" y="156" width="90" height="0" fill="#4a8fb0"/>
  <path d="M672 156 L762 156 L762 178 L672 178 Z" fill="#4a8fb0"/>
  <text x="746" y="171" text-anchor="middle" font-size="11" fill="#ffffff">mar</text>
  <!-- falla i castor -->
  <path d="M700 150 L716 186" stroke="#b03a3a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="686" y="138" width="16" height="10" fill="#7d848a" stroke="#4a5055"/>
  <path d="M689 148 l-2 8 M699 148 l2 8" stroke="#7d848a" stroke-width="2"/>

  <!-- terra base -->
  <path d="M18 156 L672 156 L672 178 L18 178 Z" fill="#dfd6bd"/>

  <!-- marcadors -->
  <g font-size="13" font-weight="900">
    <circle cx="66" cy="120" r="13" fill="#C0872E" stroke="#ffffff" stroke-width="2.5"/>
    <text x="66" y="125" text-anchor="middle" fill="#ffffff">1</text>
    <circle cx="616" cy="164" r="13" fill="#C0872E" stroke="#ffffff" stroke-width="2.5"/>
    <text x="616" y="169" text-anchor="middle" fill="#ffffff">2</text>
    <circle cx="688" cy="170" r="13" fill="#C0872E" stroke="#ffffff" stroke-width="2.5"/>
    <text x="688" y="175" text-anchor="middle" fill="#ffffff">3</text>
  </g>
  <text x="196" y="80" font-size="12" font-weight="700" fill="#4a5750">ELS PORTS</text>
  <text x="196" y="94" font-size="11" fill="#6a7770">vessant cremat</text>
  <text x="758" y="104" text-anchor="end" font-size="11" font-weight="700" fill="#b03a3a">falla d'Amposta</text>
  <text x="758" y="117" text-anchor="end" font-size="11" fill="#a05050">i magatzem Castor</text>
</svg>
