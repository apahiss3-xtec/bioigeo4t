<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" role="img" aria-labelledby="t d"><title id="t">El pla d’en Biel i la frase del tractant</title><desc id="d">A l’esquerra: 20 mules, anys després, quants mulets? A la dreta: 12.000 mules, 1 de cada 2.000 fa òvuls viables, quantes en surten?</desc><rect width="760" height="206" fill="#fff"/><text x="190" y="34" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="18" font-weight="800" fill="#4A2463">El pla d’en Biel</text><text x="570" y="34" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="18" font-weight="800" fill="#4A2463">La frase del tractant</text><rect x="14" y="56" width="106" height="84" rx="12" fill="#fff" stroke="#7B3F9E" stroke-width="2.2"/><text x="67" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#7B3F9E">20</text><text x="67" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463">mules</text><line x1="122" y1="98" x2="142.0" y2="98.0" stroke="#4A2463" stroke-width="2.6"/><path d="M150,98 L137.1,91.8 L137.1,104.2 Z" fill="#4A2463"/><rect x="152" y="56" width="88" height="84" rx="12" fill="#fff" stroke="#6F6878" stroke-width="2.2"/><text x="196" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#6F6878">anys</text><text x="196" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463">després</text><line x1="242" y1="98" x2="262.0" y2="98.0" stroke="#4A2463" stroke-width="2.6"/><path d="M270,98 L257.1,91.8 L257.1,104.2 Z" fill="#4A2463"/><rect x="272" y="56" width="96" height="84" rx="12" fill="#fff" stroke="#6E5000" stroke-width="2.2"/><text x="320" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#6E5000">?</text><text x="320" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463">mulets</text><line x1="380" y1="24" x2="380" y2="178" stroke="#A66BC9" stroke-width="2" stroke-dasharray="5 6"/><rect x="392" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#7B3F9E" stroke-width="2.2"/><text x="451" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#7B3F9E">12.000</text><text x="451" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463">mules</text><text x="530" y="106" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="26" font-weight="800" fill="#4A2463">×</text><rect x="546" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#6F6878" stroke-width="2.2"/><text x="605" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#6F6878">1 / 2.000</text><text x="605" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463">fan òvuls</text><text x="678" y="106" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="26" font-weight="800" fill="#4A2463">=</text><rect x="692" y="56" width="56" height="84" rx="12" fill="#fff" stroke="#6E5000" stroke-width="2.2"/><text x="720" y="92" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="21" font-weight="800" fill="#6E5000">?</text><text x="720" y="117" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4A2463"></text><text x="190" y="172" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#6F6878">Què caldria perquè tinguessin cries?</text><text x="570" y="172" text-anchor="middle" font-family="'Fira Sans Extra Condensed','Fira Sans','Arial Narrow',sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#6F6878">«Mai, ni una»: és cert?</text></svg>
