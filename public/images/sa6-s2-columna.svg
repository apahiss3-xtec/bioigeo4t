<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Fira Sans Extra Condensed',sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#fdfefe"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="900" fill="#2A3D4C">Columna d'estrats: llegir l'ordre del temps</text>

  <!-- column -->
  <g>
    <!-- oldest bottom -->
    <rect x="120" y="330" width="150" height="55" fill="#2f6f8a" stroke="#1f2d36"/>
    <rect x="120" y="275" width="150" height="55" fill="#c9a24a" stroke="#1f2d36"/>
    <rect x="120" y="220" width="150" height="55" fill="#7a6a55" stroke="#1f2d36"/>
    <rect x="120" y="165" width="150" height="55" fill="#9a9a9a" stroke="#1f2d36"/>
    <rect x="120" y="110" width="150" height="55" fill="#8a9a4a" stroke="#1f2d36"/>
    <!-- fossil marks -->
    <text x="195" y="362" text-anchor="middle" font-size="16">🐚</text>
    <text x="195" y="252" text-anchor="middle" font-size="16">🌿</text>
    <text x="195" y="142" text-anchor="middle" font-size="16">🦴</text>
  </g>

  <!-- older/newer axis -->
  <line x1="95" y1="110" x2="95" y2="385" stroke="#3A5266" stroke-width="2" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3A5266"/></marker></defs>
  <text x="70" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#3A5266" transform="rotate(-90 70,120)">més recent (a dalt)</text>
  <text x="70" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#8a2f14" transform="rotate(-90 70,375)">més antic (a sota)</text>

  <!-- descriptions right -->
  <g font-size="12.5" fill="#33404b">
    <circle cx="300" cy="137" r="11" fill="#3A5266"/><text x="300" y="141" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">5</text>
    <text x="320" y="141">Sòl amb ossos de mamífers → terra ferma, el més recent</text>
    <circle cx="300" cy="192" r="11" fill="#3A5266"/><text x="300" y="196" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">4</text>
    <text x="320" y="196">Cendra volcànica → hi va haver una erupció</text>
    <circle cx="300" cy="247" r="11" fill="#3A5266"/><text x="300" y="251" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">3</text>
    <text x="320" y="251">Fulles i troncs fòssils → un bosc / zona pantanosa</text>
    <circle cx="300" cy="302" r="11" fill="#3A5266"/><text x="300" y="306" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">2</text>
    <text x="320" y="306">Sorra de riu → un riu va passar per aquí</text>
    <circle cx="300" cy="357" r="11" fill="#8a2f14"/><text x="300" y="361" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">1</text>
    <text x="320" y="361">Conquilles marines → hi havia mar, el més antic</text>
  </g>
  <text x="360" y="412" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5c7285">Principi de superposició: es llegeix de baix (1, més antic) a dalt (5, més recent).</text>
</svg>
