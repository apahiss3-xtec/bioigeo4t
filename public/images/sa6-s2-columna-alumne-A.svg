<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Fira Sans Extra Condensed',sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#fdfefe"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="900" fill="#2A3D4C">Reconstrueix la història d'aquesta columna</text>
  <g>
    <rect x="120" y="330" width="150" height="55" fill="#2f6f8a" stroke="#1f2d36"/>
    <rect x="120" y="275" width="150" height="55" fill="#c9a24a" stroke="#1f2d36"/>
    <rect x="120" y="220" width="150" height="55" fill="#7a6a55" stroke="#1f2d36"/>
    <rect x="120" y="165" width="150" height="55" fill="#9a9a9a" stroke="#1f2d36"/>
    <rect x="120" y="110" width="150" height="55" fill="#8a9a4a" stroke="#1f2d36"/>
    <text x="195" y="362" text-anchor="middle" font-size="16">🐚</text>
    <text x="195" y="252" text-anchor="middle" font-size="16">🌿</text>
    <text x="195" y="142" text-anchor="middle" font-size="16">🦴</text>
    <text x="145" y="405" font-size="10.5" fill="#5c7285" font-style="italic">(el color/símbol de cada capa és una pista)</text>
  </g>
  <line x1="95" y1="110" x2="95" y2="385" stroke="#3A5266" stroke-width="2" marker-end="url(#a4)"/>
  <defs><marker id="a4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3A5266"/></marker></defs>
  <text x="298" y="70" font-size="12.5" font-weight="700" fill="#8a5e18">Escenes desordenades: quina va passar primer? (1 = més antiga)</text>
  <g font-size="12.5" fill="#33404b">
    <rect x="300" y="98" width="22" height="22" rx="4" fill="#fff" stroke="#C0872E" stroke-width="1.5"/>
    <text x="335" y="114">Va caure cendra d'una erupció volcànica</text>
    <rect x="300" y="150" width="22" height="22" rx="4" fill="#fff" stroke="#C0872E" stroke-width="1.5"/>
    <text x="335" y="166">Un riu hi dipositava sorra</text>
    <rect x="300" y="202" width="22" height="22" rx="4" fill="#fff" stroke="#C0872E" stroke-width="1.5"/>
    <text x="335" y="218">Hi vivien mamífers terrestres (ossos)</text>
    <rect x="300" y="254" width="22" height="22" rx="4" fill="#fff" stroke="#C0872E" stroke-width="1.5"/>
    <text x="335" y="270">Hi havia un bosc / zona pantanosa (fulles, troncs)</text>
    <rect x="300" y="306" width="22" height="22" rx="4" fill="#fff" stroke="#C0872E" stroke-width="1.5"/>
    <text x="335" y="322">El lloc era cobert pel mar (conquilles marines)</text>
  </g>
  <text x="360" y="425" text-anchor="middle" font-size="12" font-style="italic" fill="#5c7285">Fixa't en QUINA capa conté cada pista i aplica la superposició: el que és a sota és més antic.</text>
</svg>
