<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="276" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">La finestra de temps en què va passar</text>
<text x="380" y="44" text-anchor="middle" font-size="12.5" fill="#5a5580">Dades de la sessió anterior. Qualsevol hipòtesi sobre l'origen de la vida ha de cabre aquí dins</text>
<text x="380" y="70" text-anchor="middle" font-size="12" fill="#33404b">Abans de 3.900 Ma la superfície rebia impactes constants; de roques d'aquella època gairebé no se n'ha conservat cap</text>

<line x1="70" y1="150" x2="700" y2="150" stroke="#241F4A" stroke-width="2"/>
<polygon points="700,150 690,145 690,155" fill="#241F4A"/>
<text x="586" y="136" font-size="12" fill="#33404b">temps → cap al present</text>

<rect x="110" y="96" width="190" height="38" rx="7" fill="#f6dcd6" stroke="#c4796b" stroke-width="1.6"/>
<text x="205" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#8a3d2c">ETAPA D'IMPACTES</text>
<text x="205" y="128" text-anchor="middle" font-size="11" fill="#5d3126">la vida s'hauria esborrat</text>

<rect x="300" y="96" width="100" height="38" rx="7" fill="#dff0e6" stroke="#3f8a63" stroke-width="2"/>
<text x="350" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f5c3d">LA FINESTRA</text>
<text x="350" y="128" text-anchor="middle" font-size="10" fill="#26533c">aquí dins va passar</text>
<line x1="300" y1="134" x2="300" y2="142" stroke="#3f8a63" stroke-width="1.6"/>
<line x1="400" y1="134" x2="400" y2="142" stroke="#3f8a63" stroke-width="1.6"/>

<g stroke="#241F4A" stroke-width="1.6">
<line x1="110" y1="142" x2="110" y2="158"/>
<line x1="300" y1="142" x2="300" y2="158"/>
<line x1="400" y1="142" x2="400" y2="158"/>
<line x1="540" y1="142" x2="540" y2="158"/>
<line x1="660" y1="142" x2="660" y2="158"/>
</g>

<text x="110" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#241F4A">4.600 Ma</text>
<text x="110" y="192" text-anchor="middle" font-size="11.5" fill="#5a5580">es forma la Terra</text>

<text x="270" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#241F4A">≈ 3.900 Ma</text>
<text x="270" y="192" text-anchor="middle" font-size="11.5" fill="#5a5580">s'acaba l'època</text>
<text x="270" y="207" text-anchor="middle" font-size="11.5" fill="#5a5580">de més impactes</text>

<text x="412" y="176" font-size="12" font-weight="700" fill="#1f5c3d">3.800 Ma</text>
<text x="412" y="192" font-size="11.5" fill="#26533c">primers indicis de vida</text>
<text x="412" y="207" font-size="11.5" fill="#26533c">(restes de carboni)</text>

<line x1="540" y1="158" x2="540" y2="224" stroke="#3f8a63" stroke-width="1" stroke-dasharray="3 3"/>
<text x="548" y="232" font-size="11.5" font-weight="700" fill="#1f5c3d">3.500 Ma</text>
<text x="548" y="247" font-size="11.5" fill="#26533c">estromatòlits</text>

<text x="660" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#241F4A">avui</text>

<text x="86" y="232" font-size="11" font-style="italic" fill="#7c8a96">Atenció: l'eix NO està a escala.</text>
<text x="380" y="266" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7a5800">Recorda com s'ha de dir: la prova diu que a 3.800 Ma ja hi HAVIA vida, no que hi APAREGUÉS aquell dia</text>
</svg>
