<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 640" width="760" height="640">
<title>Exemple resolt d un tall</title>
<rect width="760" height="640" fill="#fdfefe"/>
<defs><pattern id="hx" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#8a9aa4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6d7f8a" stroke-width="1.5"/></pattern></defs>
<text x="380.0" y="30" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="17" font-weight="900" fill="#3A5266" text-anchor="middle">EXEMPLE RESOLT: COM S&#39;ORDENA UN TALL</text>
<text x="380.0" y="50" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12" font-weight="400" fill="#5c7285" text-anchor="middle">Un altre tall, m&#233;s senzill, amb l&#39;ordre i el principi de cada pas</text>
<defs><clipPath id="fw"><rect x="60" y="76" width="640" height="254"/></clipPath><clipPath id="wr"><path d="M470,190 L704,190 L704,370 L516,370 Z"/></clipPath></defs>
<g clip-path="url(#fw)"><rect x="20" y="76" width="720" height="58" fill="#a8c08a" stroke="#7a8f9c" stroke-width="1.2"/><rect x="20" y="134" width="720" height="56" fill="#eef2f4" stroke="#7a8f9c" stroke-width="1.2"/><rect x="20" y="190" width="720" height="60" fill="#e8dcc0" stroke="#7a8f9c" stroke-width="1.2"/><rect x="20" y="250" width="720" height="80" fill="#d9b978" stroke="#7a8f9c" stroke-width="1.2"/><rect x="248" y="190" width="24" height="180" fill="#8c3f3f" stroke="#6d2f2f" stroke-width="1.4"/><g clip-path="url(#wr)"><rect x="460" y="190" width="250" height="12" fill="#eef2f4" stroke="#7a8f9c" stroke-width="1.2"/><rect x="460" y="202" width="250" height="60" fill="#e8dcc0" stroke="#7a8f9c" stroke-width="1.2"/><rect x="460" y="262" width="250" height="92" fill="#d9b978" stroke="#7a8f9c" stroke-width="1.2"/></g><path d="M470,190 L516,370" stroke="#243440" stroke-width="4"/></g>
<rect x="60" y="76" width="640" height="254" fill="none" stroke="#2A3D4C" stroke-width="2"/>
<circle cx="672" cy="105.0" r="12" fill="#fff" stroke="#3A5266" stroke-width="1.8"/><text x="672" y="109.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#3A5266" text-anchor="middle">P</text>
<circle cx="672" cy="162.0" r="12" fill="#fff" stroke="#3A5266" stroke-width="1.8"/><text x="672" y="166.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#3A5266" text-anchor="middle">N</text>
<circle cx="672" cy="220.0" r="12" fill="#fff" stroke="#3A5266" stroke-width="1.8"/><text x="672" y="224.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#3A5266" text-anchor="middle">L</text>
<circle cx="672" cy="290.0" r="12" fill="#fff" stroke="#3A5266" stroke-width="1.8"/><text x="672" y="294.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#3A5266" text-anchor="middle">K</text>
<circle cx="260" cy="300" r="12" fill="#fff" stroke="#6d2f2f" stroke-width="1.8"/><text x="260" y="304.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#6d2f2f" text-anchor="middle">M</text>
<circle cx="524" cy="300" r="12" fill="#fff" stroke="#243440" stroke-width="1.8"/><text x="524" y="304.9" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="14" font-weight="900" fill="#243440" text-anchor="middle">Y</text>
<text x="60" y="354" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="600" fill="#5c7285" text-anchor="start">K &#183; L &#183; N &#183; P = capes horitzontals &#160;&#183;&#160; M = dic de magma &#160;&#183;&#160; Y = falla</text>
<rect x="60" y="366" width="640" height="118" rx="8" fill="#eef3f6" stroke="#a9bccb" stroke-width="1.4"/>
<text x="74" y="384" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11" font-weight="900" fill="#3A5266" text-anchor="start">ORDRE DELS ESDEVENIMENTS, DEL M&#201;S ANTIC AL M&#201;S MODERN</text>
<circle cx="86" cy="402" r="10" fill="#fff" stroke="#C0872E" stroke-width="1.8"/><text x="86" y="406.2" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12" font-weight="900" fill="#C0872E" text-anchor="middle">1</text>
<text x="106" y="406" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12.5" font-weight="700" fill="#2A3D4C" text-anchor="start">Es diposita la capa K</text>
<text x="390" y="406" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#8a5e18" text-anchor="start">superposici&#243;: &#233;s la de m&#233;s avall</text>
<circle cx="86" cy="425" r="10" fill="#fff" stroke="#C0872E" stroke-width="1.8"/><text x="86" y="429.2" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12" font-weight="900" fill="#C0872E" text-anchor="middle">2</text>
<text x="106" y="429" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12.5" font-weight="700" fill="#2A3D4C" text-anchor="start">Es diposita la capa L, a sobre de K</text>
<text x="390" y="429" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#8a5e18" text-anchor="start">superposici&#243;</text>
<circle cx="86" cy="448" r="10" fill="#fff" stroke="#C0872E" stroke-width="1.8"/><text x="86" y="452.2" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12" font-weight="900" fill="#C0872E" text-anchor="middle">3</text>
<text x="106" y="452" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12.5" font-weight="700" fill="#2A3D4C" text-anchor="start">La falla Y (que desplaça K i L) i el dic M</text>
<text x="390" y="452" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#8a5e18" text-anchor="start">intersecci&#243;: tallen K i L &#8594; posteriors a L</text>
<circle cx="86" cy="471" r="10" fill="#fff" stroke="#C0872E" stroke-width="1.8"/><text x="86" y="475.2" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12" font-weight="900" fill="#C0872E" text-anchor="middle">4</text>
<text x="106" y="475" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="12.5" font-weight="700" fill="#2A3D4C" text-anchor="start">Es dipositen N i P</text>
<text x="390" y="475" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#8a5e18" text-anchor="start">no estan tallades &#8594; s&#243;n posteriors</text>
<rect x="60" y="498" width="640" height="66" rx="8" fill="#fdf7e2" stroke="#c8960a" stroke-width="1.4"/>
<text x="74" y="517" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11" font-weight="900" fill="#7a5800" text-anchor="start">QU&#200; NO ENS DIUEN ELS PRINCIPIS</text>
<text x="74" y="534" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#7a5800" text-anchor="start">La falla Y i el dic M no es tallen l&#39;un a l&#39;altre: no podem saber quin dels dos va ser primer.</text>
<text x="74" y="550" font-family="'Fira Sans Extra Condensed',sans-serif" font-size="11.5" font-weight="400" fill="#7a5800" text-anchor="start">Per resoldre-ho caldria una dataci&#243; absoluta (els anys, amb la radioactivitat).</text>
</svg>
