  <text x="380" y="46" text-anchor="middle" font-size="24" font-weight="900" fill="#1c4a55">🕵️ El detector: encara està buit</text>
  <text x="380" y="70" text-anchor="middle" font-size="14" fill="#6b7a7e">Els senyals els poseu vosaltres a la posada en comú. Ni els noms ni el nombre venen donats.</text>

