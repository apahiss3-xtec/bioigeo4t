<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Fira Sans Extra Condensed, Arial, sans-serif">
<rect width="760" height="452" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#241F4A">Els rellotges de què disposa el laboratori</text>
<text x="380" y="46" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a5580">Cada element de partida es transforma en un altre a un ritme propi que no es pot accelerar ni frenar.</text>
<rect x="24" y="62" width="712" height="30" fill="#241F4A"/>
<text x="33" y="82" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">ELEMENT</text>
<text x="159" y="82" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">ES CONVERTEIX</text>
<text x="285" y="82" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">SEMIVIDA</text>
<text x="409" y="82" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">ON SERVEIX</text>
<text x="565" y="82" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">PER A QUÈ SERVEIX</text>
<rect x="24" y="92" width="712" height="62" fill="#f1effa" stroke="#e0dcee" stroke-width="1"/>
<text x="33" y="128" font-size="13.5" font-weight="700" fill="#241F4A">Carboni-14</text>
<text x="159" y="128" font-size="12.5" fill="#33404b">nitrogen-14</text>
<text x="285" y="128" font-size="12.5" font-weight="700" fill="#8a6410">5.730 anys</text>
<text x="409" y="118" font-size="11.5" fill="#33404b">de 600 fins a</text>
<text x="409" y="135" font-size="11.5" fill="#33404b">50.000 anys</text>
<text x="565" y="118" font-size="11.5" fill="#2b4a75">restes RECENTS del que</text>
<text x="565" y="135" font-size="11.5" fill="#2b4a75">ha estat viu: fusta, carbó</text>
<rect x="24" y="154" width="712" height="62" fill="#ffffff" stroke="#e0dcee" stroke-width="1"/>
<text x="33" y="190" font-size="13.5" font-weight="700" fill="#241F4A">Urani-235</text>
<text x="159" y="190" font-size="12.5" fill="#33404b">plom-207</text>
<text x="285" y="190" font-size="12.5" font-weight="700" fill="#8a6410">700 milions d'anys</text>
<text x="409" y="180" font-size="11.5" fill="#33404b">de 70 a 7.000</text>
<text x="409" y="197" font-size="11.5" fill="#33404b">milions d'anys</text>
<text x="565" y="180" font-size="11.5" fill="#2b4a75">roques antigues</text>
<text x="565" y="197" font-size="11.5" fill="#2b4a75">(és l'exemple de dalt)</text>
<rect x="24" y="216" width="712" height="62" fill="#f1effa" stroke="#e0dcee" stroke-width="1"/>
<text x="33" y="252" font-size="13.5" font-weight="700" fill="#241F4A">Potassi-40</text>
<text x="159" y="252" font-size="12.5" fill="#33404b">argó-40</text>
<text x="285" y="252" font-size="12.5" font-weight="700" fill="#8a6410">1.300 milions d'anys</text>
<text x="409" y="242" font-size="11.5" fill="#33404b">de 100.000 anys a</text>
<text x="409" y="259" font-size="11.5" fill="#33404b">13.000 milions d'anys</text>
<text x="565" y="242" font-size="11.5" fill="#2b4a75">roques volcàniques:</text>
<text x="565" y="259" font-size="11.5" fill="#2b4a75">lava i cendra</text>
<rect x="24" y="278" width="712" height="62" fill="#ffffff" stroke="#e0dcee" stroke-width="1"/>
<text x="33" y="314" font-size="13.5" font-weight="700" fill="#241F4A">Urani-238</text>
<text x="159" y="314" font-size="12.5" fill="#33404b">plom-206</text>
<text x="285" y="314" font-size="12.5" font-weight="700" fill="#8a6410">4.470 milions d'anys</text>
<text x="409" y="304" font-size="11.5" fill="#33404b">a partir de</text>
<text x="409" y="321" font-size="11.5" fill="#33404b">450 milions d'anys</text>
<text x="565" y="304" font-size="11.5" fill="#2b4a75">les roques i els meteorits</text>
<text x="565" y="321" font-size="11.5" fill="#2b4a75">més antics</text>
<rect x="24" y="354" width="712" height="88" rx="8" fill="#eaf0f9" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="38" y="376" font-size="13" font-weight="700" fill="#2b4a75">La regla per triar el rellotge</text>
<text x="38" y="396" font-size="12" fill="#2b4a75">Un rellotge serveix, a grans trets, entre una dècima part i deu vegades la seva semivida: si la mostra és molt més jove no</text>
<text x="38" y="414" font-size="12" fill="#2b4a75">s'hi ha transformat res mesurable, i si és molt més vella ja no en queda res. És una regla ORIENTATIVA: la columna ON SERVEIX</text>
<text x="38" y="432" font-size="12" fill="#2b4a75">mana sobre la regla, i quan hi passa més d'un rellotge, decideix la columna del material i l'edat que esperes trobar.</text>
</svg>