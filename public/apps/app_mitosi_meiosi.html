<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divisió cel·lular · Mitosi i Meiosi · IE Temple · 4t ESO</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #c084fc;
  --purple-ink: #5a4aa0;
  --purple-deep: #7B68C8;
  --ink: #1A1A2E;
  --ink-2: #4A3F3F;
  --muted: #666666;
  --surface: #fdfafb;
  --rule: #EAE6F6;
  --rule-dark: #C8C2DD;
  --teal: #81c3c3;
  --teal-tint: #EAF3F8;
  --yellow-tint: #FFF9E0;
  --purple-tint: #EFEAF5;
  --green-tint: #EAF4EB;
  --peach-tint: #FBEEE0;
  --chr1: #E76F6F;
  --chr2: #6FA3E7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: 'Fira Sans Extra Condensed', sans-serif;
  background: var(--surface);
  color: var(--ink-2);
  /* l'app ocupa tota la finestra (iframe o pantalla completa): sense scroll de pàgina */
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
}
header, .mode-bar, .phase-timeline, .app-footer { flex: none; }

/* ── HEADER ─────────────────────────────────────── */
header {
  background: var(--purple-ink);
  padding: 14px 24px 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
.header-left { display: flex; flex-direction: column; }
.header-eyebrow {
  font-size: 11px; font-weight: 700; color: var(--purple);
  letter-spacing: .1em; text-transform: uppercase;
}
.header-title { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.1; }
.header-right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.lang-btn, .simplify-btn, .fs-btn {
  font-family: 'Fira Sans Extra Condensed', sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; cursor: pointer;
  border: none; border-radius: 9999px;
  padding: 5px 14px; transition: all .2s;
}
.simplify-btn {
  background: var(--yellow-tint); color: var(--purple-ink);
}
.simplify-btn:hover { background: #f9dc5c; }
.simplify-btn.active { background: #f9dc5c; box-shadow: 0 0 0 2px var(--purple-ink); }

.fs-btn { background: #fff; color: var(--purple-ink); }
.fs-btn:hover { background: var(--purple-tint); }
.lang-btn { background: rgba(255,255,255,.12); color: #fff; }
.lang-btn:hover { background: rgba(255,255,255,.22); }
.lang-btn.active { background: var(--purple); color: var(--ink); }

/* ── MODE TOGGLE ────────────────────────────────── */
.mode-bar {
  display: flex; align-items: stretch; gap: 0;
  border-bottom: 2px solid var(--rule);
  background: var(--surface);
}
.mode-tab {
  font-family: 'Fira Sans Extra Condensed', sans-serif;
  font-size: 18px; font-weight: 700; cursor: pointer;
  padding: 12px 32px; border: none; background: transparent;
  color: var(--muted); letter-spacing: .05em;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all .2s; text-transform: uppercase;
}
.mode-tab:hover { color: var(--purple-deep); }
.mode-tab.active {
  color: var(--purple-ink);
  border-bottom-color: var(--purple-ink);
  background: var(--purple-tint);
}
.mode-badge {
  display: inline-block; font-size: 11px; font-weight: 400;
  background: var(--rule); color: var(--muted);
  border-radius: 9999px; padding: 1px 8px; margin-left: 6px;
  vertical-align: middle;
}
.mode-tab.active .mode-badge {
  background: var(--purple-deep); color: #fff;
}

/* ── LAYOUT ─────────────────────────────────────── */
/* Dibuix + etiqueta + navegació a l'esquerra; descripció a la dreta (amb scroll propi) */
.app-body {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(300px, 40%, 460px);
  grid-template-rows: minmax(0, 1fr) auto auto;
  grid-template-areas:
    "canvas side"
    "label  side"
    "nav    side";
}

/* ── PHASE TIMELINE ─────────────────────────────── */
.phase-timeline {
  display: flex; align-items: center; gap: 0;
  padding: 16px 20px;
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  background: #fff;
}
.phase-btn {
  font-family: 'Fira Sans Extra Condensed', sans-serif;
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; cursor: pointer;
  padding: 8px 16px; border: 2px solid var(--rule);
  background: var(--surface); color: var(--muted);
  border-radius: 8px; white-space: nowrap;
  transition: all .2s; position: relative;
  flex-shrink: 0;
}
.phase-btn:hover { border-color: var(--purple-deep); color: var(--purple-deep); }
.phase-btn.active {
  background: var(--purple-ink); color: #fff;
  border-color: var(--purple-ink);
}
.phase-arrow {
  font-size: 16px; color: var(--rule-dark); flex-shrink: 0; padding: 0 4px;
}
.phase-divider {
  font-size: 10px; font-weight: 700; color: var(--teal);
  letter-spacing: .08em; text-transform: uppercase;
  background: var(--teal-tint); border-radius: 4px; padding: 3px 8px;
  flex-shrink: 0; margin: 0 6px;
}

/* ── CELL CANVAS ────────────────────────────────── */
.cell-canvas {
  grid-area: canvas;
  display: flex; align-items: center; justify-content: center;
  padding: 16px 24px;
  background: var(--surface);
  position: relative; overflow: hidden;
  min-height: 0;
}
.app-body.compara .cell-canvas { overflow-y: auto; align-items: flex-start; }
.cell-canvas::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 30%, rgba(192,132,252,.06) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 70%, rgba(129,195,195,.05) 0%, transparent 60%);
  pointer-events: none;
}

.cell-diagram {
  /* s'escala al màxim de l'espai disponible (viewBox 400×320) */
  width: 100%; height: 100%; max-width: 640px;
  transition: opacity .3s ease;
}

/* ── PHASE LABEL ────────────────────────────────── */
.phase-label-area {
  grid-area: label;
  padding: 12px 24px 8px;
  background: var(--surface);
  border-top: 1px solid var(--rule);
}
.phase-label-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--purple-deep);
}
.phase-label-title {
  font-size: 32px; font-weight: 700; color: var(--ink); line-height: 1.05;
}
.phase-label-notation {
  display: inline-block;
  font-size: 14px; font-weight: 700; letter-spacing: .06em;
  background: var(--purple-ink); color: #fff;
  border-radius: 6px; padding: 2px 10px; margin-top: 4px;
}

/* ── SIDE INFO ──────────────────────────────────── */
.side-info {
  grid-area: side;
  min-height: 0;
  border-left: 1px solid var(--rule);
  padding: 20px 22px;
  background: #fff;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.info-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--purple-ink);
  border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 4px;
}
.info-text {
  font-size: 16px; line-height: 1.55; color: var(--ink-2);
}
.info-text.simplified {
  font-size: 17px; line-height: 1.6; color: var(--ink);
  font-weight: 400;
}

.key-points { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.key-point {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 15px; color: var(--ink-2); line-height: 1.45;
}
.key-point::before {
  content: '→';
  color: var(--purple-deep); font-weight: 700; flex-shrink: 0; margin-top: 1px;
}

.chromosome-legend {
  background: var(--purple-tint); border-radius: 8px; padding: 12px;
}
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

.notation-badge {
  display: inline-block; font-size: 13px; font-weight: 700;
  background: var(--purple-ink); color: #fff;
  border-radius: 6px; padding: 2px 10px; margin-top: 6px;
}

.compare-table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
.compare-table th {
  background: var(--purple-ink); color: #fff; padding: 8px 10px;
  text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.compare-table td {
  padding: 7px 10px; border-bottom: 1px solid var(--rule); color: var(--ink-2);
}
.compare-table tr:nth-child(even) td { background: var(--purple-tint); }

/* ── TOOLTIP SISTEMA MULTILINGÜE ─────────────────── */
.tr-word {
  cursor: help;
  border-bottom: 1px dashed var(--purple-deep);
  position: relative; display: inline;
}
.tr-word .tooltip-box {
  display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
  background: var(--purple-ink); color: #fff;
  font-size: 14px; font-weight: 700; padding: 4px 10px;
  border-radius: 6px; white-space: nowrap; z-index: 100;
  pointer-events: none;
}
.tr-word .tooltip-box::after {
  content: ''; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%); border: 5px solid transparent;
  border-top-color: var(--purple-ink);
}
.lang-ar .tr-word .tooltip-ar,
.lang-es .tr-word .tooltip-es,
.lang-ur .tr-word .tooltip-ur { display: block; }

/* ── COMPARISON VIEW ────────────────────────────── */
.comparison-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px; padding: 4px;
}
.comparison-cell {
  background: #fff; border: 1px solid var(--rule); border-radius: 12px;
  overflow: hidden;
}
.comparison-header {
  background: var(--purple-ink); color: #fff;
  padding: 10px 16px; font-size: 16px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase;
}
.comparison-content { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* ── ANIMATIONS ─────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.cell-diagram { animation: fadeIn .35s ease; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
.chromosome-pulse { animation: pulse 2s ease-in-out infinite; }

/* ── NAV BOTTOM ─────────────────────────────────── */
.bottom-nav {
  grid-area: nav;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px;
  border-top: 1px solid var(--rule);
  background: var(--surface);
}
.nav-btn {
  font-family: 'Fira Sans Extra Condensed', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: .04em;
  cursor: pointer; border: 2px solid var(--purple-ink);
  border-radius: 8px; padding: 8px 20px;
  background: transparent; color: var(--purple-ink);
  transition: all .2s;
}
.nav-btn:hover { background: var(--purple-ink); color: #fff; }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.nav-btn.primary { background: var(--purple-ink); color: #fff; }
.nav-btn.primary:hover { background: var(--purple-deep); border-color: var(--purple-deep); }

.step-counter {
  font-size: 14px; color: var(--muted); letter-spacing: .05em;
  text-transform: uppercase;
}

/* ── SCROLLBAR ──────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--rule); }
::-webkit-scrollbar-thumb { background: var(--rule-dark); border-radius: 3px; }

/* ── PEU (autoria i llicència) ──────────────────── */
.app-footer {
  padding: 6px 16px; border-top: 1px solid var(--rule);
  font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center;
}
.app-footer a { color: var(--purple-ink); }

/* ── PANTALLES GRANS (ordinador / pantalla completa): text més còmode de llegir ── */
@media (min-width: 1100px) {
  .app-body { grid-template-columns: minmax(0, 1fr) clamp(360px, 36%, 560px); }
  .info-text { font-size: 19px; line-height: 1.55; }
  .info-text.simplified { font-size: 20px; }
  .key-point { font-size: 18px; }
  .info-section-title { font-size: 13px; }
  .phase-label-title { font-size: 38px; }
  .phase-btn { font-size: 15px; padding: 9px 18px; }
  .mode-tab { font-size: 20px; }
  .step-counter { font-size: 16px; }
  .nav-btn { font-size: 17px; padding: 10px 26px; }
  .header-title { font-size: 26px; }
  .compare-table { font-size: 16px; }
}

/* ── PANTALLES PETITES (mòbil): una columna i scroll de pàgina ── */
@media (max-width: 720px) {
  body { height: auto; min-height: 100vh; display: block; }
  header { flex-wrap: wrap; }
  .app-body {
    display: flex; flex-direction: column;
  }
  .cell-canvas { min-height: 300px; }
  .cell-diagram { height: auto; }
  .side-info { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .bottom-nav { order: 3; }
  .side-info { order: 4; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-eyebrow">Biologia i Geologia · 4t ESO · IE Temple · SA2 «La cèl·lula»</span>
    <span class="header-title">Divisió cel·lular: Mitosi i Meiosi</span>
  </div>
  <div class="header-right">
    <button class="fs-btn" id="btnFs" onclick="toggleFullscreen()" title="Pantalla completa">⛶ Pantalla completa</button>
    <button class="simplify-btn" id="btnSimplify" onclick="toggleSimplify()">Simplifica</button>
    <button class="lang-btn" id="btnAr" onclick="setLang('ar')">عربي</button>
    <button class="lang-btn" id="btnEs" onclick="setLang('es')">Castellano</button>
    <button class="lang-btn" id="btnUr" onclick="setLang('ur')">اردو</button>
  </div>
</header>

<!-- Mode tabs -->
<div class="mode-bar">
  <button class="mode-tab active" id="tabMitosi" onclick="setMode('mitosi')">
    Mitosi <span class="mode-badge">6 fases</span>
  </button>
  <button class="mode-tab" id="tabMeiosi" onclick="setMode('meiosi')">
    Meiosi <span class="mode-badge">10 fases</span>
  </button>
  <button class="mode-tab" id="tabCompara" onclick="setMode('compara')">
    Compara
  </button>
</div>

<!-- Phase timeline -->
<div class="phase-timeline" id="phaseTimeline"></div>

<!-- Main layout -->
<div class="app-body" id="appBody">
  <!-- Cell canvas -->
  <div class="cell-canvas" id="cellCanvas">
    <svg id="cellSvg" class="cell-diagram" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" width="400" height="320"></svg>
  </div>

  <!-- Phase label -->
  <div class="phase-label-area" id="phaseLabelArea">
    <div class="phase-label-eyebrow" id="phaseEyebrow"></div>
    <div class="phase-label-title" id="phaseTitle"></div>
    <div id="phaseNotation"></div>
  </div>

  <!-- Side info -->
  <div class="side-info" id="sideInfo"></div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn" id="btnPrev" onclick="navigate(-1)">← Anterior</button>
    <span class="step-counter" id="stepCounter"></span>
    <button class="nav-btn primary" id="btnNext" onclick="navigate(1)">Següent →</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────
// SVG DRAWING FUNCTIONS — convenció de cromosomes de la SA2 (26/09/2026)
//   FORMA: bastonet amb centròmer i bandes · MIDA = tipus (llarg / curt)
//   COLOR = origen: vermell = de la mare, blau = del pare
//   «I» = sense copiar · «X» = copiat (2 cromàtides) · una X és UN cromosoma
//   Model: 2n = 4 (2 parelles). Humà: 2n = 46, n = 23.
// ─────────────────────────────────────────────────

const colors = {
  membrane: '#7B68C8',
  nuclearMembrane: '#5a4aa0',
  mare: '#D2474F', mareD: '#8E2430',
  pare: '#2F6DB5', pareD: '#173F73',
  spindle: '#B9AEDC',
  gold: '#C8960A', goldInk: '#6E5000',
  cellFill: 'rgba(239,234,245,0.45)',
  nucleusFill: 'rgba(225,212,240,0.55)',
};
const FONT = "font-family=\"Fira Sans Extra Condensed, Arial Narrow, sans-serif\"";
const TYPES = {
  L: { p: 15, q: 27, bands: [[0.55, 'p'], [0.35, 'q'], [0.7, 'q']] },
  S: { p: 10, q: 17, bands: [[0.5, 'q']] },
};
const other = o => (o === 'm' ? 'p' : 'm');
const fillOf = o => (o === 'm' ? colors.mare : colors.pare);
const strokeOf = o => (o === 'm' ? colors.mareD : colors.pareD);

function armPath(L, w) {
  const h = w / 2;
  return `M${-w*.26},0 Q${-h},${-w*.25} ${-h},${-w*.75} L${-h},${-(L-h)} A${h},${h} 0 0 1 ${h},${-(L-h)} L${h},${-w*.75} Q${h},${-w*.25} ${w*.26},0 Z`;
}
// Braç d'una cromàtide. tip = origen del tros final intercanviat pel crossing over (o null)
function arm(L, w, o, angle, bands, tip) {
  const h = w / 2;
  let s = `<g transform="rotate(${angle})"><path d="${armPath(L, w)}" fill="${fillOf(o)}" stroke="${strokeOf(o)}" stroke-width="1.3" stroke-linejoin="round"/>`;
  if (tip) {
    const y0 = -L * 0.55;
    s += `<path d="M${-h},${y0} L${-h},${-(L-h)} A${h},${h} 0 0 1 ${h},${-(L-h)} L${h},${y0} Z" fill="${fillOf(tip)}" stroke="${strokeOf(tip)}" stroke-width="1.3" stroke-linejoin="round"/>`;
  }
  bands.forEach(f => {
    const y = -(w*.8 + f*(L - w*1.4));
    s += `<line x1="${-h*.72}" y1="${y}" x2="${h*.72}" y2="${y}" stroke="#fff" stroke-opacity=".55" stroke-width="${Math.max(1.2, w*.2)}" stroke-linecap="round"/>`;
  });
  return s + '</g>';
}
// Cromàtide amb centròmer a (0,0). rec = true → el braç llarg porta un tros de l'altre progenitor
function chromatid(t, o, ap, aq, sc, rec) {
  const T = TYPES[t], w = 9 * sc;
  const bp = T.bands.filter(b => b[1] === 'p').map(b => b[0]);
  const bq = T.bands.filter(b => b[1] === 'q').map(b => b[0]);
  return arm(T.p*sc, w, o, ap, bp, null) + arm(T.q*sc, w, o, aq, bq, rec ? other(o) : null) +
    `<circle r="${w*.3}" fill="${strokeOf(o)}"/>`;
}
// Cromosoma SENSE copiar («I»)
function single(x, y, t, o, rot = 0, sc = 1, rec = false, bend = 0) {
  return `<g transform="translate(${x},${y}) rotate(${rot})">${chromatid(t, o, -bend, 180 + bend, sc, rec)}</g>`;
}
// Cromosoma COPIAT («X»). rec = índex de la cromàtide recombinant (0 o 1) o null
function double(x, y, t, o, rot = 0, sc = 1, rec = null, spread = 11) {
  const w = 9 * sc, off = w * .46;
  return `<g transform="translate(${x},${y}) rotate(${rot})">` +
    `<g transform="translate(${-off},0)">${chromatid(t, o, -spread, 180 + spread, sc, rec === 0)}</g>` +
    `<g transform="translate(${off},0)">${chromatid(t, o, spread, 180 - spread, sc, rec === 1)}</g>` +
    `<ellipse rx="${w*.7}" ry="${w*.38}" fill="${strokeOf(o)}"/></g>`;
}
// Cromàtide estirada cap a un pol (anafase): centròmer al davant, braços en V endarrere
function vshape(x, y, t, o, toward = 0, sc = 1, rec = false, spread = 28) {
  const back = toward + 180;
  return `<g transform="translate(${x},${y})">${chromatid(t, o, back - spread, back + spread, sc, rec)}</g>`;
}
// Cromatina: fils prims (interfase)
function chromatin(cx, cy, r, seed = 3, n = 6) {
  let s = seed, out = '';
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  ['m', 'p'].forEach(o => {
    for (let k = 0; k < n; k++) {
      let a = rnd() * 6.283, rr = (0.1 + rnd() * 0.55) * r, x = cx + rr*Math.cos(a), y = cy + rr*Math.sin(a);
      const pts = [[x, y]];
      for (let j = 0; j < 5; j++) {
        a += (rnd() - .5) * 3.2; x += Math.cos(a)*r*.32; y += Math.sin(a)*r*.32;
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
        if (d > r*.82) { x = cx + dx/d*r*.8; y = cy + dy/d*r*.8; }
        pts.push([x, y]);
      }
      let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length - 1; i++)
        d += ` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${((pts[i][0]+pts[i+1][0])/2).toFixed(1)},${((pts[i][1]+pts[i+1][1])/2).toFixed(1)}`;
      out += `<path d="${d}" fill="none" stroke="${fillOf(o)}" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>`;
    }
  });
  return out;
}
function cellBase(cx, cy, rx, ry, fill = colors.cellFill) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${colors.membrane}" stroke-width="3"/>`;
}
// Cèl·lula que s'estrangula (telofase): dues meitats unides per un solc
function pinched(cx, cy, rx, ry, pinch = 22) {
  const t = cy - ry, b = cy + ry, k = rx * 0.55;
  return `<path d="M${cx},${t} C${cx+k},${t} ${cx+rx},${cy-ry*.55} ${cx+rx},${cy-ry*.25} Q${cx+rx},${cy-10} ${cx+rx-pinch},${cy} Q${cx+rx},${cy+10} ${cx+rx},${cy+ry*.25} C${cx+rx},${cy+ry*.55} ${cx+k},${b} ${cx},${b} C${cx-k},${b} ${cx-rx},${cy+ry*.55} ${cx-rx},${cy+ry*.25} Q${cx-rx},${cy+10} ${cx-rx+pinch},${cy} Q${cx-rx},${cy-10} ${cx-rx},${cy-ry*.25} C${cx-rx},${cy-ry*.55} ${cx-k},${t} ${cx},${t} Z" fill="${colors.cellFill}" stroke="${colors.membrane}" stroke-width="3"/>`;
}
function nucleus(cx, cy, r, dashed = false) {
  return dashed
    ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors.nuclearMembrane}" stroke-width="1.5" stroke-dasharray="5,4" opacity=".45"/>`
    : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors.nucleusFill}" stroke="${colors.nuclearMembrane}" stroke-width="2"/>`;
}
function nucleusE(cx, cy, rx, ry) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${colors.nucleusFill}" stroke="${colors.nuclearMembrane}" stroke-width="1.8"/>`;
}
function fibres(px, py, pts) {
  return pts.map(p => `<line x1="${px}" y1="${py}" x2="${p[0]}" y2="${p[1]}" stroke="${colors.spindle}" stroke-width="1.2"/>`).join('') +
    `<circle cx="${px}" cy="${py}" r="3.5" fill="${colors.spindle}"/>`;
}
function plate(cx, cy, half) {
  return `<line x1="${cx-half}" y1="${cy}" x2="${cx+half}" y2="${cy}" stroke="${colors.gold}" stroke-width="1.4" stroke-dasharray="4,3"/>`;
}
// Comptador (dalt a l'esquerra) + peu de dues línies
function counter(txt) {
  const w = txt.length * 6.3 + 24;
  return `<rect x="8" y="8" width="${w}" height="24" rx="12" fill="#fff" stroke="${colors.gold}" stroke-width="1.4"/>` +
    `<text x="${8 + w/2}" y="24.5" text-anchor="middle" ${FONT} font-size="13" font-weight="800" fill="${colors.goldInk}">${txt}</text>`;
}
function caption(l1, l2) {
  return `<text x="200" y="298" text-anchor="middle" ${FONT} font-size="13.5" fill="#555">${l1}</text>` +
    (l2 ? `<text x="200" y="314" text-anchor="middle" ${FONT} font-size="12.5" font-weight="bold" fill="${colors.nuclearMembrane}">${l2}</text>` : '');
}
function wrap(inner) {
  return `<rect width="400" height="320" fill="transparent"/>` + inner;
}

function getPhases() { return PHASES[mode] || []; }

function renderTimeline() {
  const tl = document.getElementById('phaseTimeline');
  const phases = getPhases();
  let html = '';

  if (mode === 'meiosi') {
    phases.forEach((p, i) => {
      if (i === 1) html += `<span class="phase-divider">— Meiosi I —</span>`;
      if (i === 5) html += `<span class="phase-divider">— Meiosi II —</span>`;
      if (i === 9) html += `<span class="phase-divider">— Resultat —</span>`;
      html += `<button class="phase-btn${currentPhase === i ? ' active' : ''}" onclick="goTo(${i})">${p.name}</button>`;
      if (i < phases.length - 1) html += `<span class="phase-arrow">→</span>`;
    });
  } else if (mode === 'mitosi') {
    phases.forEach((p, i) => {
      html += `<button class="phase-btn${currentPhase === i ? ' active' : ''}" onclick="goTo(${i})">${p.name}</button>`;
      if (i < phases.length - 1) html += `<span class="phase-arrow">→</span>`;
    });
  }

  tl.innerHTML = html;

  // la fase activa queda centrada a la línia de fases (la meiosi en té 10)
  const act = tl.querySelector('.phase-btn.active');
  if (act) tl.scrollLeft = act.offsetLeft - (tl.clientWidth - act.offsetWidth) / 2;
}

function renderPhase() {
  if (mode === 'compara') { renderCompara(); return; }

  const phases = getPhases();
  const ph = phases[currentPhase];
  if (!ph) return;

  // SVG
  const svg = document.getElementById('cellSvg');
  svg.style.opacity = 0;
  setTimeout(() => {
    svg.innerHTML = ph.svg();
    svg.style.opacity = 1;
  }, 150);

  // Labels
  document.getElementById('phaseEyebrow').textContent = ph.eyebrow;
  document.getElementById('phaseTitle').textContent = ph.name;

  const notEl = document.getElementById('phaseNotation');
  notEl.innerHTML = ph.notation
    ? `<span class="phase-label-notation">${ph.notation}</span>`
    : '';

  // Side info
  const si = document.getElementById('sideInfo');
  si.innerHTML = `
    <div>
      <div class="info-section-title">Descripció</div>
      <div class="info-text${simplified ? ' simplified' : ''}" id="phaseDesc">
        ${simplified ? ph.simplified : ph.description}
      </div>
    </div>
    <div>
      <div class="info-section-title">Punts clau</div>
      <ul class="key-points">
        ${ph.points.map(p => `<li class="key-point">${p}</li>`).join('')}
      </ul>
    </div>
    <div class="chromosome-legend">
      <div class="info-section-title" style="border-color:var(--rule-dark)">Com llegir els cromosomes</div>
      <svg viewBox="0 0 250 78" width="100%" style="max-width:300px;display:block" role="img" aria-label="Com llegir els cromosomes">
        ${single(14, 36, 'L', 'm', 0, .8)}${single(32, 36, 'L', 'p', 0, .8)}
        <text x="46" y="30" ${FONT} font-size="13" font-weight="800" fill="#4A3F3F">color = d’on ve</text>
        <text x="46" y="46" ${FONT} font-size="13" font-weight="800"><tspan fill="${colors.mare}">mare</tspan><tspan fill="#666"> o </tspan><tspan fill="${colors.pare}">pare</tspan></text>
        <text x="46" y="62" ${FONT} font-size="12" fill="#666">mida = tipus</text>
        ${single(152, 34, 'L', 'm', 0, .8)}${double(218, 34, 'L', 'm', 0, .8)}
        <text x="152" y="72" text-anchor="middle" ${FONT} font-size="11.5" font-weight="700" fill="#666">sense copiar</text>
        <text x="218" y="72" text-anchor="middle" ${FONT} font-size="11.5" font-weight="700" fill="#666">copiat (X) = 1</text>
      </svg>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Compta: <strong style="color:var(--purple-ink)">${ph.chromosomes}</strong></div>
      <div class="notation-badge">${ph.notation || ''}</div>
    </div>
  `;

  // Step counter
  document.getElementById('stepCounter').textContent =
    `Fase ${currentPhase + 1} / ${phases.length}`;

  // Nav buttons
  document.getElementById('btnPrev').disabled = currentPhase === 0;
  document.getElementById('btnNext').disabled = currentPhase === phases.length - 1;
  document.getElementById('btnNext').textContent =
    currentPhase === phases.length - 1 ? 'Fi' : 'Següent →';

  applyLang();
}

function setMode(m) {
  mode = m;
  currentPhase = 0;
  document.getElementById('appBody').classList.toggle('compara', m === 'compara');
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');

  const tl = document.getElementById('phaseTimeline');
  tl.style.display = m === 'compara' ? 'none' : 'flex';

  const bl = document.querySelector('.bottom-nav');
  bl.style.display = m === 'compara' ? 'none' : 'flex';

  const cv = document.getElementById('cellCanvas');
  cv.style.display = 'flex';
  cv.style.flexWrap = m === 'compara' ? 'wrap' : '';

  if (m !== 'compara') {
    // createElementNS: amb createElement('svg') el dibuix no es pintava en tornar de Compara
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'cellSvg';
    svg.classList.add('cell-diagram');
    svg.setAttribute('viewBox', '0 0 400 320');
    svg.setAttribute('width', '400');
    svg.setAttribute('height', '320');
    cv.innerHTML = '';
    cv.appendChild(svg);
    if (ORIG) {
      document.getElementById('phaseLabelArea').innerHTML = ORIG.label;
      document.querySelector('.bottom-nav').innerHTML = ORIG.nav;
    }
  }

  renderAll();
}

function goTo(i) {
  currentPhase = i;
  renderAll();
}

function navigate(dir) {
  const phases = getPhases();
  currentPhase = Math.max(0, Math.min(phases.length - 1, currentPhase + dir));
  renderAll();
}

function toggleSimplify() {
  simplified = !simplified;
  document.getElementById('btnSimplify').classList.toggle('active', simplified);
  renderPhase();
}

// Pantalla completa: dins l'iframe cal que la pàgina que l'allotja hi tingui allowfullscreen;
// si el navegador no ho permet, s'obre l'app en una pestanya nova.
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) {
    (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) {
    window.open(location.href, '_blank', 'noopener');
    return;
  }
  const p = req.call(el);
  if (p && p.catch) p.catch(() => window.open(location.href, '_blank', 'noopener'));
}
function syncFsButton() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.getElementById('btnFs').textContent = on ? '✕ Surt de pantalla completa' : '⛶ Pantalla completa';
}
document.addEventListener('fullscreenchange', syncFsButton);
document.addEventListener('webkitfullscreenchange', syncFsButton);

function setLang(l) {
  lang = lang === l ? null : l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  if (lang) document.getElementById('btn' + l.charAt(0).toUpperCase() + l.slice(1)).classList.add('active');
  applyLang();
}

function applyLang() {
  const body = document.body;
  body.classList.remove('lang-ar', 'lang-es', 'lang-ur');
  if (lang) body.classList.add('lang-' + lang);
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (mode === 'compara') return;
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
});

// Init
renderAll();
</script>
