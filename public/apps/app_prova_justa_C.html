function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, k, seed){ const a = Array.from({length:n}, (_, i) => i < k); const r = rng(seed);
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let nivell = "B";
try { const v = localStorage.getItem("portal-bio4t-nivell"); if (v === "A" || v === "B" || v === "C") nivell = v; } catch(e) {}
if (C) nivell = "C"; else if (nivell === "C") nivell = "B";

const STEPS = C ? STEPS_C : STEPS_AB;
const state = {}; // per pas: {answer, seen:Set, view}
let cur = 0;
let sim = { tries:0, winsSmall:0, small:null, big:null };

function visible(){ return STEPS.filter(s => !s.onlyA || nivell === "A"); }

function renderMode(){
  const m = document.getElementById("mode");
  if (C){ m.innerHTML = '<span style="font-size:14px;font-weight:700;padding:4px 12px">Nivell C</span>'; return; }
  m.innerHTML = ["B","A"].map(n => `<button aria-pressed="${nivell===n}" data-n="${n}">Nivell ${n}</button>`).join("");
  m.querySelectorAll("button").forEach(b => b.onclick = () => {
    nivell = b.dataset.n; try { localStorage.setItem("portal-bio4t-nivell", nivell); } catch(e) {}
    const vs = visible(); if (cur > vs.length) cur = vs.length; render();
  });
}

function done(s){ const st = state[s.id]; return st && st.answer != null && s.opts[st.answer].ok; }
function unlocked(i){ const vs = visible(); for (let j = 0; j < i; j++) if (!done(vs[j])) return false; return true; }

function renderNav(){
  const vs = visible();
  const items = vs.map((s, i) => `<button data-i="${i}" ${i===cur?'aria-current="step"':''} class="${done(s)?'fet':''}" ${unlocked(i)?'':'disabled'}>${done(s)?'✓ ':''}${s.tab}</button>`);
  items.push(`<button data-i="${vs.length}" ${cur===vs.length?'aria-current="step"':''} ${unlocked(vs.length)?'':'disabled'}>🧩 La prova justa</button>`);
  const nav = document.getElementById("nav"); nav.innerHTML = items.join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { cur = +b.dataset.i; render(); window.scrollTo({top:0, behavior:"smooth"}); });
}

function dotsHTML(g, arr){
  const cured = arr || shuffled(g.n, g.k, g.seed);
  const k = cured.filter(Boolean).length;
  return `<div class="grp ${g.zen?'zen':''}"><div class="gt">${g.nom}</div><div class="gs">${g.sub||''}</div>
    <div class="dots ${g.n<=4?'poc':''}">${cured.map(c => `<span class="dot ${c?'cur':''}"></span>`).join("")}</div>
    <div class="num">${k} <small>de ${g.n}</small></div></div>`;
}

function simRun(){
  const p = 0.75, draw = n => Array.from({length:n}, () => Math.random() < p);
  const n = C ? 10 : 40;
  sim.small = [draw(4), draw(4)]; sim.big = [draw(n), draw(n)];
  const c = a => a.filter(Boolean).length;
  sim.tries++;
  if (c(sim.small[0]) - c(sim.small[1]) >= 2) sim.winsSmall++;
}

function renderSim(s, st){
  if (!sim.small) simRun();
  const n = C ? 10 : 40, c = a => a.filter(Boolean).length;
  const d4 = c(sim.small[0]) - c(sim.small[1]);
  const pct = sim.tries ? Math.round(100 * sim.winsSmall / sim.tries) : 0;
  st.seen = st.seen || new Set(); if (sim.tries >= 5) st.seen.add("sim");
  return `<h3>4 persones per grup</h3><div class="groups">
      ${dotsHTML({nom:"Grup A · ZenStop", sub:"4 persones", n:4, zen:true}, sim.small[0])}
      ${dotsHTML({nom:"Grup B · placebo", sub:"4 persones", n:4}, sim.small[1])}</div>
    <p style="margin-top:8px"><b>${d4 >= 2 ? "😮 ZenStop «guanya» per " + d4 + "!" : d4 <= -2 ? "😮 El placebo «guanya» per " + (-d4) + "!" : "Gairebé iguals."}</b></p>
    <h3>${n} persones per grup</h3><div class="groups">
      ${dotsHTML({nom:"Grup A · ZenStop", sub:n+" persones", n, zen:true}, sim.big[0])}
      ${dotsHTML({nom:"Grup B · placebo", sub:n+" persones", n}, sim.big[1])}</div>
    <div class="row"><button class="btn" id="rep">🎲 Repeteix</button>
      <span class="tally">Proves: <b>${sim.tries}</b> · amb 4 persones, ZenStop ha «guanyat» per 2 o més <b>${sim.winsSmall}</b> vegades${sim.tries?` (${pct} %)`:''}</span></div>
    ${sim.tries < 5 ? `<p class="note">Repeteix-ho almenys 5 vegades per poder respondre (${sim.tries}/5).</p>` : ''}`;
}

function render(){
  renderMode(); renderNav();
  const vs = visible(), main = document.getElementById("main");
  if (cur >= vs.length){ main.innerHTML = finalHTML(); return; }
  const s = vs[cur], st = state[s.id] = state[s.id] || {answer:null, seen:new Set()};
  const keys = s.views ? Object.keys(s.views) : [];
  if (s.views && !st.view) st.view = keys[0];
  if (s.views) st.seen.add(st.view);
  let body = `<div class="card"><div class="k">Pas ${cur+1} de ${vs.length}</div><h2>${s.title}</h2><p class="story">${s.story}</p>`;
  if (s.sim){ body += renderSim(s, st); }
  else {
    const v = s.views[st.view];
    if (keys.length > 1) body += `<div class="toggle" role="group">${keys.map(k => `<button aria-pressed="${k===st.view}" data-v="${k}">${s.views[k].label}</button>`).join("")}</div>`;
    body += `<div class="groups">${v.groups.map(g => dotsHTML(g)).join("")}</div>`;
  }
  body += `<div class="legend"><span><i class="c"></i>${C ? "sí" : "curat / millor"}</span><span><i></i>no</span><span>${s.meas}</span></div></div>`;

  const need = s.sim ? ["sim"] : (s.mustSee || []);
  const ready = need.every(k => st.seen.has(k));
  body += `<div class="card"><div class="q">${s.q}</div>`;
  if (!ready) body += `<p class="note">${s.sim ? "Primer, prem Repeteix unes quantes vegades." : "Primer, mira les dues opcions de dalt (" + need.map(k => s.views[k].label).join(" i ") + ")."}</p>`;
  else {
    body += `<div class="opts">${s.opts.map((o, i) => {
      const cls = st.answer === i ? (o.ok ? "ok" : "ko") : (done(s) && o.ok ? "ok" : "");
      return `<button class="opt ${cls}" data-o="${i}" ${done(s)?'disabled':''}>${o.t}</button>`; }).join("")}</div>`;
    if (st.answer != null){
      const o = s.opts[st.answer];
      body += `<div class="fb ${o.ok?'ok':'ko'}">${o.ok ? "✅ " : "🤔 "}${o.fb}${o.ok ? "" : " <i>Torna-ho a provar.</i>"}</div>`;
      if (o.ok) body += `<div class="trap">🕳️ <b>La trampa:</b> ${s.trap}<br>✏️ ${C ? "Paraula per a la fitxa:" : "A la fitxa, en una paraula:"} <b class="w">${s.word}</b></div>
        <div class="row"><button class="btn" id="next">${cur+1 < vs.length ? "Pas següent →" : "🧩 Munta la prova justa →"}</button></div>`;
    }
  }
  body += `</div>`;
  main.innerHTML = body;
  main.querySelectorAll(".toggle button").forEach(b => b.onclick = () => { st.view = b.dataset.v; render(); });
  main.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.o; st.answer = i; render();
  });
  const rep = document.getElementById("rep"); if (rep) rep.onclick = () => { simRun(); render(); };
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => { cur++; render(); window.scrollTo({top:0, behavior:"smooth"}); };
}

function finalHTML(){
  if (C) return `<div class="card"><div class="k">Resum</div><h2>🧩 La prova justa</h2>
    <div class="pieces">
      <div class="piece"><b>1 · Dos grups</b><span>Un pren el producte, l'altre no. Si no, no sé si es cura <b>sol</b>.</span></div>
      <div class="piece"><b>2 · Ningú no ho sap</b><span>Si ho saps, et trobes millor perquè t'ho <b>creus</b>.</span></div>
      <div class="piece"><b>3 · Prou gent</b><span>Amb 4 persones, pot guanyar per <b>sort</b>.</span></div></div>
    <div class="motlle">El grup A rep <span class="b">ZenStop</span>. El grup B rep <span class="b">un xiclet sense res</span>. Ningú no sap qui rep què. Miro si <span class="b">es curen</span>.</div>
    <p style="margin-top:10px">Si els dos grups surten <b>igual</b>, ZenStop <b>no funciona</b>.</p></div>
    <div class="card"><h3>Ara, a la fitxa</h3><p>Completa les 3 frases amb <b>SOL · CREUS · SORT</b>.</p></div>`;
  const A = nivell === "A";
  return `<div class="card"><div class="k">Resum</div><h2>🧩 Anatomia d'una prova justa</h2>
    <div class="pieces">
      <div class="piece"><b>🆚 Grup de comparació</b><span>Un grup no rep el producte (o en rep una imitació). Si no, no saps si s'hauria curat sol.</span></div>
      <div class="piece"><b>🎲 A l'atzar</b><span>Sorteges qui va a cada grup. Si no, els grups ja són diferents abans de començar.</span></div>
      <div class="piece"><b>🙈 A cegues</b><span>Ningú no sap qui rep què (doble cec: ni qui mesura). Si no, creure-s'ho ja fa efecte.</span></div>
      <div class="piece"><b>👥 Prou gent</b><span>Com més gent, menys hi pot la sort. I cal repetir-ho.</span></div>
      ${A ? `<div class="piece"><b>🎯 Control positiu</b><span>Proves la prova amb una cosa que sabem que funciona.</span></div>` : ''}</div>
    <h3>El motlle</h3>
    <div class="motlle">🧪 Faig <b>dos grups a l'atzar</b>. El grup A rep <span class="b">ZenStop</span>; el grup B rep <b>una imitació</b> (o res): <span class="b">un xiclet sense res</span>. <b>Ningú no sap</b> qui rep què. Tot el demés és <b>igual</b>. Mesuro <span class="b">quants es curen en 7 dies</span>. Si els dos grups surten igual, la promesa <b>cau</b>.</div>
    <p style="margin-top:10px">I després, <b>acceptar el resultat</b>, encara que no agradi.</p></div>
    <div class="card"><h3>Ho reconeixes als casos del puzle?</h3><ul class="links">
      <li><b>Cas 3 · Emily Rosa</b>: els practicants no veien on era la mà, i ella tirava una moneda. Peces: <b>a cegues</b> i <b>atzar</b>.</li>
      <li><b>Cas 4 · Bany de peus</b>: la màquina amb aigua i <b>sense peus</b> també es torna marró. Peça: <b>comparació</b>.</li>
      <li><b>Cas 5 · Trasplantament</b>: fa fàstic, però van repartir els pacients <b>a l'atzar</b> i el van comparar amb el tractament habitual. Peces: <b>atzar</b> i <b>comparació</b>.</li></ul>
      <p style="margin-top:8px"><b>Ara, a la fitxa:</b> ${A ? "omple el motlle per decidir el <b>cas 6</b> i digues quanta gent hi posaries." : "omple el motlle per posar a prova el <b>cas 1</b> (l'aigua que recorda)."}</p></div>`;
}

render();
</script>
</body>
</html>
