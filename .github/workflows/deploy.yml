name: Desplega a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositori
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instal·lar dependències
        run: npm ci

      - name: Build de producció
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Pujar l'artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Avisa el repositori de Temple Obert perque refresqui la copia d'aquest
  # portal que publica sota templeobert.cat. Es un extra: si aixo falla, el
  # portal segueix desplegat a la seva propia URL de GitHub Pages.
  #
  # Cal el secret DISPATCH_TEMPLEOBERT (un token fine-grained amb permis
  # "Contents: read and write" nomes sobre ietemple/web). Mentre no hi sigui,
  # aquest pas no fa res i no marca el desplegament com a fallit.
  avisar-templeobert:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Avisar templeobert
        env:
          TOKEN: ${{ secrets.DISPATCH_TEMPLEOBERT }}
          DESTI: ${{ vars.TEMPLEOBERT_REPO || 'ietemple/web' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No hi ha el secret DISPATCH_TEMPLEOBERT: no avisem ningu."
            echo "Aixo no es un error; vegeu el README."
            exit 0
          fi

          codi=$(curl -sS -o /tmp/resposta.txt -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$DESTI/dispatches" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"event_type":"portal-actualitzat"}')

          echo "Resposta de $DESTI: HTTP $codi"
          cat /tmp/resposta.txt
          test "$codi" = "204"
